<!doctype html>
<html lang="da"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SoMe-performance</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg?v=4">
<script>
// SoMe-siden vises inde i butik-redigerings "SoMe"-fane (en iframe under samme topbar, ligesom
// vagtplanen). Aabnes den direkte, sendes man derhen i stedet.
if (window.top === window) location.replace('../butik-redigering/#some');
// Tema (system/lys/moerk) deles med butik-redigering via localStorage 'blho-tema'.
const systemMoerk = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function saetTema() {
  let valg = 'system';
  try { const v = localStorage.getItem('blho-tema'); if (v === 'lys' || v === 'moerk') valg = v; } catch (e) {}
  const moerk = valg === 'moerk' || (valg === 'system' && !!systemMoerk && systemMoerk.matches);
  document.documentElement.setAttribute('data-tema', moerk ? 'moerk' : 'lys');
}
saetTema();
window.addEventListener('storage', e => { if (e.key === 'blho-tema') saetTema(); });
if (systemMoerk && systemMoerk.addEventListener) systemMoerk.addEventListener('change', saetTema);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Samme farve-variabler som vagtplanen, saa de to faner ligner hinanden i lys og moerk tilstand */
:root{--bg:#f4f4f2;--fg:#1a1a1a;--mut:#6c6577;--card:#fff;--bd:#e2e2e2;--felt:#ddd;--bad:#c93a3a;--ok:#2b8a4f;--brand:#040DB1;--brand-tekst:#040DB1;--badge:#eef0fd;--fejl-bg:#fdecea;--fejl:#b92a15;--facebook:#1877F2;--instagram:#D93175;--tiktok:#241F21;color-scheme:light}
:root[data-tema="moerk"]{--bg:#15161b;--fg:#e8e8ee;--mut:#9a9cab;--card:#1e2029;--bd:#3a3d4a;--felt:#4a4d5a;--bad:#ff7a7a;--ok:#6fd49a;--brand:#3d47e0;--brand-tekst:#9aa6ff;--badge:#262b4d;--fejl-bg:#3a2023;--fejl:#ff7b6b;--facebook:#5aa2ff;--instagram:#f06aa3;--tiktok:#d0d0d8;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);margin:0;color:var(--fg);font-size:15px;line-height:1.4}
.indhold{padding:16px 20px 40px;max-width:1280px;margin:0 auto}
.laeser{text-align:center;color:var(--mut);padding:20vh 20px}
.hoved{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px}
.hoved h1{font-size:20px;margin:0;color:var(--brand-tekst)}
.hoved .luft{flex:1}
select,button{font-family:inherit;font-size:13px}
select{padding:7px 10px;border:1px solid var(--felt);border-radius:8px;background:var(--card);color:var(--fg)}
.knap{padding:7px 14px;border:none;border-radius:8px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.knap:disabled{opacity:.5;cursor:default}
.chips{display:inline-flex;background:var(--badge);border-radius:20px;padding:3px;gap:2px}
.chip{background:none;border:none;color:var(--brand-tekst);font-weight:700;font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer}
.chip.aktiv{background:var(--brand);color:#fff}
.status{font-size:12px;color:var(--mut)}.status.bad{color:var(--bad)}
.kort{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.kort h2{font-size:15px;margin:0 0 12px}
.kort h2 small{font-weight:400;color:var(--mut);margin-left:6px}
.noegletal{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tal{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.tal .navn{font-size:12px;font-weight:600;color:var(--mut)}
.tal .vaerdi{font-size:24px;font-weight:700;margin:2px 0}
.tal .aendring{font-size:12px;color:var(--mut)}
.op{color:var(--ok);font-weight:700}.ned{color:var(--bad);font-weight:700}
.graf svg{width:100%;height:220px;display:block}
.graf .akse{font-size:11px;fill:var(--mut)}
.rul{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600;cursor:pointer;user-select:none}
th.sorteret{color:var(--brand-tekst)}
tr:last-child td{border-bottom:none}
.konto{display:flex;align-items:center;gap:8px}
.prik{width:9px;height:9px;border-radius:50%;flex:none}
.prik.facebook{background:var(--facebook)}.prik.instagram{background:var(--instagram)}.prik.tiktok{background:var(--tiktok)}
.lille{font-size:11px;color:var(--mut)}
.opslag{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.opslag:last-child{border-bottom:none}
.opslag img,.opslag .tom{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--badge)}
.opslag .tekst{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px}
.opslag a{color:inherit;text-decoration:none}.opslag a:hover .tekst{text-decoration:underline}
.opslag .tal2{text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}
.opslag .tal2 b{color:var(--fg);font-size:14px}
.besked{background:var(--badge);color:var(--brand-tekst);border-radius:12px;padding:16px;margin-bottom:16px;font-size:14px}
.besked.fejl{background:var(--fejl-bg);color:var(--fejl)}
details.advarsler{font-size:12px;color:var(--mut);margin-top:8px}
details.advarsler li{margin:2px 0}
@media (max-width:760px){.indhold{padding:12px}.opslag{grid-template-columns:44px 1fr}.opslag img,.opslag .tom{width:44px;height:44px}.opslag .tal2{grid-column:2;text-align:left}}
</style></head><body>

<div class="laeser" id="laeserVis">Indlæser…</div>
<div class="laeser" id="ingenAdgangVis" hidden>Din konto har ikke adgang til SoMe-tallene.</div>

<div class="indhold" id="app" hidden>
  <div class="hoved">
    <h1>SoMe-performance</h1>
    <span class="chips" id="platforme"></span>
    <span class="luft"></span>
    <span class="status" id="status"></span>
    <select id="periode" aria-label="Periode">
      <option value="7">Seneste 7 dage</option>
      <option value="28" selected>Seneste 28 dage</option>
      <option value="90">Seneste 90 dage</option>
      <option value="aar">I år</option>
    </select>
    <button class="knap" id="opdater" title="Hent de nyeste tal fra Facebook og Instagram nu">Opdater nu</button>
  </div>

  <div id="besked" class="besked" hidden></div>
  <div class="noegletal" id="noegletal"></div>

  <div class="kort graf">
    <h2>Visninger pr. dag</h2>
    <div id="graf"></div>
  </div>

  <div class="kort">
    <h2>Konti <small id="kontiAntal"></small></h2>
    <div class="rul"><table id="konti"></table></div>
  </div>

  <div class="kort">
    <h2>Top-opslag <small>flest likes i perioden</small></h2>
    <div id="opslag"></div>
  </div>
</div>

<script>
// Tallene ligger i Supabase (some_konti, some_dag, some_opslag) bag RLS, der kun lukker brugere
// i `some_adgang` ind. De hentes fra Meta én gang i doegnet af edge-funktionen some-sync --
// denne side taler aldrig selv med Facebook/Instagram og indeholder ingen noegler.
// Der hentes kun data, naar siden aabnes eller perioden skiftes (ingen polling -- log-kvoten).
const SUPABASE_URL = 'https://irijatnmgvutrqngwpaa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_taPyJFcINrPL5JiB-ay4CQ_iscnTyy3';
// Samme storageKey som butik-redigering, saa man er logget ind her, naar man kommer derfra.
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'sb-butik-redigering-auth' } });

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tal = n => n == null ? '–' : Number(n).toLocaleString('da-DK');
const kortTal = n => n == null ? '–' : Number(n).toLocaleString('da-DK', { notation: 'compact', maximumFractionDigits: 1 });
const tilStreng = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const tilDato = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const datoKort = dt => dt.toLocaleDateString('da-DK', { day: 'numeric', month: 'short' });
const PLATFORM = { facebook: 'Facebook', instagram: 'Instagram', tiktok: 'TikTok' };

let data = null;            // svaret fra some_oversigt
let platform = 'alle';
let sortering = { felt: 'foelgere', ned: true };

function vis(id) { ['laeserVis', 'ingenAdgangVis', 'app'].forEach(x => { $('#' + x).hidden = x != id; }); }

// Perioden slutter i gaar: dagens tal er ikke faerdige foer i morgen.
function periode() {
  const til = new Date(); til.setDate(til.getDate() - 1);
  const v = $('#periode').value;
  const fra = v === 'aar' ? new Date(til.getFullYear(), 0, 1) : new Date(til.getFullYear(), til.getMonth(), til.getDate() - (Number(v) - 1));
  return { fra: tilStreng(fra), til: tilStreng(til) };
}

async function hent() {
  const p = periode();
  const { data: d, error } = await client.rpc('some_oversigt', { p_fra: p.fra, p_til: p.til });
  if (error) { besked('Kunne ikke hente tallene. Prøv igen om lidt.', true); return; }
  data = d;
  tegn();
  hentOpslag(p);
}

function besked(tekst, fejl) {
  const b = $('#besked');
  b.hidden = !tekst; b.textContent = tekst || ''; b.classList.toggle('fejl', !!fejl);
}

const valgte = () => data.konti.filter(k => platform === 'alle' || k.platform === platform);
const sum = (konti, tid, felt) => { let s = null; konti.forEach(k => { const v = k[tid][felt]; if (v != null) s = (s || 0) + Number(v); }); return s; };

function aendring(nu, foer) {
  if (nu == null || !foer) return '<span class="aendring">ingen sammenligning endnu</span>';
  const pct = (nu - foer) / foer * 100;
  const kl = pct > 0.05 ? 'op' : pct < -0.05 ? 'ned' : '';
  return `<span class="aendring"><span class="${kl}">${pct > 0 ? '▲' : pct < 0 ? '▼' : ''} ${Math.abs(pct).toLocaleString('da-DK', { maximumFractionDigits: 1 })}%</span> fra ${tal(foer)}</span>`;
}

function tegn() {
  const findes = [...new Set(data.konti.map(k => k.platform))];
  if (platform !== 'alle' && !findes.includes(platform)) platform = 'alle';
  $('#platforme').innerHTML = ['alle', ...findes].map(p => `<button type="button" class="chip${p === platform ? ' aktiv' : ''}" data-p="${p}">${p === 'alle' ? 'Alle' : PLATFORM[p]}</button>`).join('');
  $('#platforme').hidden = findes.length < 2;

  const s = data.sidste_sync;
  if (!data.konti.length) {
    besked(s && s.ok === false && s.fejl ? 'Indsamlingen fejlede: ' + s.fejl[0]
      : 'Der er ikke hentet nogen tal endnu. Når Meta-adgangen er sat op i Supabase, hentes tallene automatisk hver morgen – eller tryk "Opdater nu".');
  } else besked('');
  $('#status').textContent = s && s.afsluttet_at ? 'Opdateret ' + new Date(s.afsluttet_at).toLocaleString('da-DK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  $('#status').classList.toggle('bad', !!s && s.ok === false);

  const k = valgte();
  const kort = [
    ['Følgere', 'foelgere'], ['Nye følgere', 'nye_foelgere'], ['Opslag', 'opslag'],
    ['Visninger', 'visninger'], ['Reaktioner og likes', 'likes'], ['Kommentarer', 'kommentarer'],
  ];
  $('#noegletal').innerHTML = kort.map(([navn, felt]) => {
    const nu = sum(k, 'nu', felt), foer = sum(k, 'foer', felt);
    return `<div class="tal"><div class="navn">${navn}</div><div class="vaerdi" title="${tal(nu)}">${nu != null && nu >= 1e6 ? kortTal(nu) : tal(nu)}</div>${aendring(nu, foer)}</div>`;
  }).join('');

  tegnGraf();
  tegnKonti(k);
}

function tegnGraf() {
  const pr = new Map();
  data.serie.forEach(r => { if (platform === 'alle' || r.platform === platform) pr.set(r.dato, (pr.get(r.dato) || 0) + Number(r.visninger || 0)); });
  const p = periode(), dage = [];
  for (let d = tilDato(p.fra), slut = tilDato(p.til); d <= slut; d.setDate(d.getDate() + 1)) dage.push(tilStreng(d));
  const v = dage.map(d => pr.get(d) || 0), maks = Math.max(...v, 1);
  if (!pr.size) { $('#graf').innerHTML = '<div class="lille">Ingen tal i perioden endnu.</div>'; return; }
  const B = 1000, H = 220, top = 14, bund = 22, venstre = 4;
  const x = i => venstre + (dage.length < 2 ? 0 : i * (B - 2 * venstre) / (dage.length - 1));
  const y = n => top + (H - top - bund) * (1 - n / maks);
  const linje = v.map((n, i) => x(i).toFixed(1) + ',' + y(n).toFixed(1)).join(' ');
  const bredde = (B - 2 * venstre) / dage.length;
  $('#graf').innerHTML = `<svg viewBox="0 0 ${B} ${H}" preserveAspectRatio="none" role="img" aria-label="Visninger pr. dag">
    <line x1="0" x2="${B}" y1="${y(0)}" y2="${y(0)}" stroke="var(--bd)"/><line x1="0" x2="${B}" y1="${y(maks)}" y2="${y(maks)}" stroke="var(--bd)" stroke-dasharray="3 4"/>
    <polygon points="${x(0)},${y(0)} ${linje} ${x(dage.length - 1)},${y(0)}" fill="var(--brand)" opacity=".12"/>
    <polyline points="${linje}" fill="none" stroke="var(--brand-tekst)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${dage.map((d, i) => `<rect x="${(x(i) - bredde / 2).toFixed(1)}" y="0" width="${bredde.toFixed(1)}" height="${H - bund}" fill="transparent"><title>${datoKort(tilDato(d))}: ${tal(v[i])}</title></rect>`).join('')}
  </svg><div class="lille" style="display:flex;justify-content:space-between"><span>${datoKort(tilDato(dage[0]))}</span><span>Højeste dag: ${tal(maks)}</span><span>${datoKort(tilDato(dage[dage.length - 1]))}</span></div>`;
}

function tegnKonti(k) {
  const kol = [['Følgere', 'foelgere'], ['Nye følgere', 'nye_foelgere'], ['Opslag', 'opslag'], ['Visninger', 'visninger'], ['Interaktioner', 'interaktioner'], ['Likes', 'likes'], ['Kommentarer', 'kommentarer']];
  const s = sortering;
  const r = k.slice().sort((a, b) => s.felt === 'navn'
    ? a.navn.localeCompare(b.navn, 'da') * (s.ned ? -1 : 1)
    : ((b.nu[s.felt] ?? -1) - (a.nu[s.felt] ?? -1)) * (s.ned ? 1 : -1));
  $('#kontiAntal').textContent = k.length ? k.length + ' konti' : '';
  $('#konti').innerHTML = `<thead><tr><th data-felt="navn" class="${s.felt === 'navn' ? 'sorteret' : ''}">Konto</th>${kol.map(([n, f]) => `<th data-felt="${f}" class="${s.felt === f ? 'sorteret' : ''}">${n}${s.felt === f ? (s.ned ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead><tbody>${
    r.map(x => `<tr><td><div class="konto"><span class="prik ${x.platform}" title="${PLATFORM[x.platform]}"></span><span>${esc(x.navn)}${x.brugernavn ? ` <span class="lille">@${esc(x.brugernavn)}</span>` : ''}</span></div></td>${kol.map(([, f]) => `<td>${tal(x.nu[f])}</td>`).join('')}</tr>`).join('')
    || `<tr><td colspan="${kol.length + 1}" class="lille">Ingen konti endnu.</td></tr>`}</tbody>`;
}

async function hentOpslag(p) {
  const naeste = tilDato(p.til); naeste.setDate(naeste.getDate() + 1);
  let q = client.from('some_opslag')
    .select('ekstern_id,oprettet_at,tekst,permalink,billede_url,likes,kommentarer,visninger,some_konti!inner(navn,platform)')
    .gte('oprettet_at', p.fra).lt('oprettet_at', tilStreng(naeste))
    .order('likes', { ascending: false, nullsFirst: false }).limit(10);
  if (platform !== 'alle') q = q.eq('some_konti.platform', platform);
  const { data: o } = await q;
  $('#opslag').innerHTML = (o || []).map(x => `<div class="opslag">
    ${x.billede_url ? `<img src="${esc(x.billede_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=tom></div>'">` : '<div class="tom"></div>'}
    <a href="${esc(/^https:\/\//.test(x.permalink || '') ? x.permalink : '#')}" target="_blank" rel="noopener"><div class="lille"><span class="prik ${x.some_konti.platform}" style="display:inline-block"></span> ${esc(x.some_konti.navn)} · ${datoKort(new Date(x.oprettet_at))}</div><div class="tekst">${esc(x.tekst || '(uden tekst)')}</div></a>
    <div class="tal2"><b>${tal(x.likes)}</b> likes · ${tal(x.kommentarer)} komm.${x.visninger != null ? ' · ' + kortTal(x.visninger) + ' visn.' : ''}</div>
  </div>`).join('') || '<div class="lille">Ingen opslag i perioden endnu.</div>';
}

$('#periode').addEventListener('change', hent);
$('#platforme').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  platform = b.dataset.p; tegn(); hentOpslag(periode());
});
$('#konti').addEventListener('click', e => {
  const th = e.target.closest('th'); if (!th) return;
  sortering = { felt: th.dataset.felt, ned: sortering.felt === th.dataset.felt ? !sortering.ned : th.dataset.felt !== 'navn' };
  tegnKonti(valgte());
});
$('#opdater').addEventListener('click', async () => {
  const k = $('#opdater');
  k.disabled = true; k.textContent = 'Henter…';
  const { data: r, error } = await client.functions.invoke('some-sync', { body: {} });
  k.disabled = false; k.textContent = 'Opdater nu';
  if (error || !r || r.fejl) { besked((r && r.fejl) || 'Kunne ikke hente nye tal lige nu. Prøv igen om lidt.', true); return; }
  await hent();
});

async function start() {
  const { data: { user } } = await client.auth.getUser();
  if (!user) { vis('ingenAdgangVis'); return; }
  // RLS paa some_adgang viser kun brugerens egen raekke -- findes den ikke, er der ingen adgang.
  const { data: adg } = await client.from('some_adgang').select('bruger_id').eq('bruger_id', user.id).maybeSingle();
  if (!adg) { vis('ingenAdgangVis'); return; }
  vis('app');
  await hent();
}
if (window.top !== window) start().catch(() => vis('ingenAdgangVis'));
</script>
</body></html>
