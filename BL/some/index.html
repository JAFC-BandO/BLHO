<script>
// SoMe-siden vises inde i butik-redigerings "SoMe"-fane (en iframe under samme topbar, ligesom
// vagtplanen). Aabnes den direkte, sendes man derhen i stedet -- medmindre adressen er et
// butikslink (?k=...), som vises uden login og kun med den butiks tal + kaedens samlede tal.
if (window.top === window && !new URLSearchParams(location.search).get('k')) location.replace('../butik-redigering/#some');
// Tema (system/lys/moerk) deles med butik-redigering via localStorage 'blho-tema'.
const systemMoerk = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function saetTema() {
  let valg = 'system';
  try { const v = localStorage.getItem('blho-tema'); if (v === 'lys' || v === 'moerk') valg = v; } catch (e) {}
  const moerk = valg === 'moerk' || (valg === 'system' && !!systemMoerk && systemMoerk.matches);
  document.documentElement.setAttribute('data-tema', moerk ? 'moerk' : 'lys');
}
saetTema();
window.addEventListener('storage', e => { if (e.key === 'blho-tema') saetTema(); });
if (systemMoerk && systemMoerk.addEventListener) systemMoerk.addEventListener('change', saetTema);
</script>

<style>
/* Samme farve-variabler som vagtplanen, saa de to faner ligner hinanden i lys og moerk tilstand.

:root[data-tema="moerk"]{--bg:#15161b;--fg:#e8e8ee;--mut:#9a9cab;--card:#1e2029;--bd:#3a3d4a;--gitter:#2b2e39;--felt:#4a4d5a;--bad:#ff7a7a;--ok:#6fd49a;--brand:#3d47e0;--brand-tekst:#9aa6ff;--badge:#262b4d;--fejl-bg:#3a2023;--fejl:#ff7b6b;--facebook:#3b82f6;--instagram:#e0508c;--tiktok:#d0d0d8;--varme:#8a97ff;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);margin:0;color:var(--fg);font-size:15px;line-height:1.4}

select,button{font-family:inherit;font-size:13px}

@media (max-width:900px){.to{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.noegletal{grid-template-columns:repeat(2,minmax(0,1fr))}.indhold{padding:12px}.opslag{grid-template-columns:44px 1fr}.opslag img,.opslag .tom{width:44px;height:44px}.opslag .tal2{grid-column:2;text-align:left}}

<script>
// Tallene ligger i Supabase (some_konti, some_dag, some_opslag) bag RLS, der kun lukker brugere
// i `some_adgang` ind. De hentes fra Meta én gang i doegnet af edge-funktionen some-sync --
// denne side taler aldrig selv med Facebook/Instagram og indeholder ingen noegler.
// Der hentes kun data, naar siden aabnes eller perioden skiftes (ingen polling -- log-kvoten).
const SUPABASE_URL = 'https://irijatnmgvutrqngwpaa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_taPyJFcINrPL5JiB-ay4CQ_iscnTyy3';
// Samme storageKey som butik-redigering, saa man er logget ind her, naar man kommer derfra.
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'sb-butik-redigering-auth' } });

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tal = n => n == null ? '–' : Number(n).toLocaleString('da-DK', { maximumFractionDigits: 1 });
const kortTal = n => n == null ? '–' : Number(n).toLocaleString('da-DK', { notation: 'compact', maximumFractionDigits: 1 });
const tilStreng = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const tilDato = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const plusDage = (s, n) => { const d = tilDato(s); d.setDate(d.getDate() + n); return tilStreng(d); };
const datoKort = dt => dt.toLocaleDateString('da-DK', { day: 'numeric', month: 'short' });
const datoLang = dt => dt.toLocaleDateString('da-DK', { weekday: 'long', day: 'numeric', month: 'long' });
const PLATFORM = { facebook: 'Facebook', instagram: 'Instagram', tiktok: 'TikTok' };
const RAEKKEFOELGE = ['facebook', 'instagram', 'tiktok']; // fast -- farven foelger platformen
const METRIK = { visninger: 'Visninger', raekkevidde: 'Rækkevidde', interaktioner: 'Interaktioner', nye_foelgere: 'Nye følgere' };
const UGEDAGE = ['Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag', 'Søndag'];
const BLOKKE = [[0, 6], [6, 9], [9, 12], [12, 15], [15, 18], [18, 21], [21, 24]];

// To maader at se siden paa:
//  - SoMe-fanen (logget ind, some_adgang): alle butikker, og man kan grave ned i én butik.
//  - Butikslink (?k=noegle, uden login): kun den butiks tal ('egen') eller kaedens samlede tal
//    ('faelles'). Serveren afgoer hvad linket maa se -- siden kan ikke bede om andre butikker.
const LINK = new URLSearchParams(location.search).get('k');
let omfang = 'egen';        // butikslink: 'egen' | 'faelles'
let butik = null;           // SoMe-fanen: valgt butik (null = alle)
let data = null;            // svaret fra some_overblik / some_rapport
let platform = 'alle';
let metrik = 'visninger';
let visning = 'butik';
let sortering = { felt: 'foelgere', ned: true };
let tabelRaekker = [];      // det tabellen viser lige nu (til CSV)

function vis(id) { ['laeserVis', 'ingenAdgangVis', 'ugyldigtLinkVis', 'app'].forEach(x => { $('#' + x).hidden = x != id; }); }

// Perioden slutter i gaar: dagens tal er ikke faerdige foer i morgen.
function periode() {
  const til = new Date(); til.setDate(til.getDate() - 1);
  const v = $('#periode').value;
  const fra = v === 'aar' ? new Date(til.getFullYear(), 0, 1) : new Date(til.getFullYear(), til.getMonth(), til.getDate() - (Number(v) - 1));
  return { fra: tilStreng(fra), til: tilStreng(til), dage: Math.round((til - fra) / 864e5) + 1 };
}

// Mens der hentes, bliver den gamle visning staaende (lidt nedtonet), saa siden ikke hopper.
async function hent() {
  const p = periode();
  $('#app').classList.add('henter');
  const { data: d, error } = LINK
    ? await client.rpc('some_rapport', { p_noegle: LINK, p_fra: p.fra, p_til: p.til, p_omfang: omfang, p_sort: $('#opslagSort').value })
    : await client.rpc('some_overblik', { p_fra: p.fra, p_til: p.til, p_butik: butik });
  $('#app').classList.remove('henter');
  if (error) { besked('Tallene kunne ikke hentes. Prøv igen om lidt.', true); return; }
  if (!d) { vis(LINK ? 'ugyldigtLinkVis' : 'ingenAdgangVis'); return; }
  data = d;
  tegn();
}

function besked(tekst, fejl) {
  const b = $('#besked');
  b.hidden = !tekst; b.textContent = tekst || ''; b.classList.toggle('fejl', !!fejl);
}

const valgte = () => data.konti.filter(k => platform === 'alle' || k.platform === platform);
const sum = (konti, tid, felt) => { let s = null; konti.forEach(k => { const v = k[tid][felt]; if (v != null) s = (s || 0) + Number(v); }); return s; };

// Sammenligningen vises kun, naar der findes tal for HELE den forrige periode -- ellers
// sammenlignes en fuld periode med et par dage, og procenterne bliver meningsloese.
function harForrige() {
  const p = periode();
  return !!data.foerste_dato && data.foerste_dato <= plusDage(p.fra, -p.dage);
}
// Sammenligner kun de konti, der har tal i BEGGE perioder -- ellers ligner det en stor
// stigning, naar en konto bare mangler historik (fx Instagrams foelgertal, som Meta kun
// udleverer 30 dage tilbage). Tal der taelles ud fra opslag (opslag, likes, kommentarer) er
// noget andet: ingen opslag i forrige periode er et rigtigt 0, ikke manglende historik.
const FRA_OPSLAG = ['opslag', 'likes', 'kommentarer', 'delinger'];
// Stories findes kun 24 timer hos Meta og kan ikke hentes bagud -- tallene begynder denne dag.
const STORIES_FRA = '2026-10-06';
// (stories er ikke med: foer indsamlingen af dem begyndte, betyder 'ingen' manglende historik)
function sammenlign(konti, felt) {
  if (!harForrige()) return null;
  const nul = FRA_OPSLAG.includes(felt);
  let nu = 0, foer = 0, med = 0; const ude = [];
  konti.forEach(k => {
    const a = k.nu[felt] ?? (nul ? 0 : null), b = k.foer[felt] ?? (nul ? 0 : null);
    if (a != null && b != null) { nu += Number(a); foer += Number(b); med++; }
    else if (a != null) ude.push(k);
  });
  if (!med || !(foer > 0)) return null;
  // "uden Instagram" kun naar hele platformen mangler -- ellers antallet af konti
  const helt = RAEKKEFOELGE.filter(p => ude.some(k => k.platform === p) && !konti.some(k => k.platform === p && !ude.includes(k)));
  const rest = ude.filter(k => !helt.includes(k.platform)).length;
  const uden = [...helt.map(p => PLATFORM[p]), ...(rest ? [rest + (rest === 1 ? ' konto' : ' konti')] : [])].join(' og ');
  return { pct: (nu - foer) / foer * 100, foer, uden };
}
function pctHtml(p) {
  if (p == null) return '';
  const kl = p > 0.05 ? 'op' : p < -0.05 ? 'ned' : '';
  return `<span class="${kl}">${p > 0.05 ? '▲' : p < -0.05 ? '▼' : ''} ${Math.abs(p).toLocaleString('da-DK', { maximumFractionDigits: 1 })}%</span>`;
}

function tegn() {
  const findes = RAEKKEFOELGE.filter(p => data.konti.some(k => k.platform === p));
  if (platform !== 'alle' && !findes.includes(platform)) platform = 'alle';
  $('#platforme').innerHTML = ['alle', ...findes].map(p => `<button type="button" class="chip${p === platform ? ' aktiv' : ''}" data-p="${p}">${p === 'alle' ? 'Alle' : PLATFORM[p]}</button>`).join('');
  $('#platforme').hidden = findes.length < 2;
  $('#metrikker').innerHTML = Object.entries(METRIK).map(([k, n]) => `<button type="button" class="chip${k === metrik ? ' aktiv' : ''}" data-m="${k}">${n}</button>`).join('');

  // Overskrift og valg af butik
  const butikNavn = n => String(n || '').replace(/^Butik\s+/, 'Børneloppen ');
  if (LINK) {
    $('#titel').textContent = omfang === 'faelles' ? 'Alle butikker' : butikNavn(data.butik);
    $('#omfang').hidden = false;
    $('#omfang').querySelector('[data-o="egen"]').textContent = butikNavn(data.butik);
    $('#opdater').hidden = true;
    $('#opslagKort').hidden = omfang === 'faelles';
  } else {
    const valg = $('#butik'), liste = data.butikker || [];
    valg.hidden = liste.length < 2;
    valg.textContent = '';
    [{ id: '', navn: 'Alle butikker' }, ...liste].forEach(b => { const o = el('option', '', butikNavn(b.navn)); o.value = b.id; valg.appendChild(o); });
    valg.value = butik || '';
  }

  const s = data.sidste_sync;
  if (s && s.ok === false) besked(LINK ? 'De nyeste tal kunne ikke hentes. Tallene nedenfor er fra sidste vellykkede indsamling.'
    : 'Den seneste indsamling fejlede: ' + ((data.sync_fejl && data.sync_fejl[0]) || 'ukendt fejl') + ' Tallene nedenfor er fra sidste vellykkede indsamling.', true);
  else if (!data.konti.length) besked(LINK ? 'Der er ikke koblet nogen Facebook- eller Instagram-konti til butikken endnu.'
    : 'Der er ikke hentet nogen tal endnu. Tryk "Opdater nu" for at hente dem – ellers hentes de automatisk hver morgen.');
  else if (!harForrige()) besked('Sammenligning med forrige periode vises, når der er samlet tal ind for en hel periode mere. Prøv en kortere periode for at se den tidligere.');

  $('#status').textContent = s && s.afsluttet_at ? 'Opdateret ' + new Date(s.afsluttet_at).toLocaleString('da-DK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  $('#status').classList.toggle('bad', !!s && s.ok === false);

  const k = valgte();
  const kort = [
    ['Følgere', 'foelgere', 'Antal følgere lige nu'], ['Nye følgere', 'nye_foelgere', 'Nye følgere i perioden'],
    ['Opslag', 'opslag', 'Opslag slået op i perioden'], ['Visninger', 'visninger', 'Hvor mange gange indholdet er blevet vist'],
    ['Rækkevidde', 'raekkevidde', 'Antal personer nået pr. dag, lagt sammen. Den samme person tæller med hver dag, hun ser noget.'],
    ['Interaktioner', 'interaktioner', 'Reaktioner, kommentarer, delinger og klik'],
    ['Reaktioner og likes', 'likes', 'På opslag slået op i perioden'], ['Kommentarer', 'kommentarer', 'På opslag slået op i perioden'],
    ['Stories', 'stories', 'Instagram-stories slået op i perioden. Samles ind fra den dag, indsamlingen blev sat op.'],
    ['Story-visninger', 'story_visninger', 'Visninger af de stories, der er slået op i perioden'],
  ];
  $('#noegletal').innerHTML = kort.map(([navn, felt, hjaelp]) => {
    const nu = sum(k, 'nu', felt), s = sammenlign(k, felt);
    return `<div class="tal" title="${esc(hjaelp)}"><div class="navn">${navn}</div><div class="vaerdi">${nu != null && nu >= 1e6 ? kortTal(nu) : tal(nu)}</div>` +
      `<div class="aendring">${s ? pctHtml(s.pct) + ' fra ' + tal(s.foer) + (s.uden ? `<br><span title="Ændringen er regnet uden ${esc(s.uden)}, fordi der ikke findes tal for forrige periode. Meta udleverer kun Instagrams følgertal 30 dage tilbage, så de bygges op dag for dag fra indsamlingens start.">Ændring uden ${esc(s.uden)}: ingen tal for forrige periode</span>` : '')
        : felt.startsWith('stor') && nu != null ? 'Siden ' + datoKort(tilDato(STORIES_FRA)) + ' – ingen forrige periode endnu' : '&nbsp;'}</div></div>`;
  }).join('');

  tegnGraf();

  tegnTider();
  hentOpslag();
}

// ---------- Fælles tooltip (graf og varmekort) ----------
const tip = $('#tip');
function visTip(x, y, byg) {
  tip.textContent = '';
  byg(tip);
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let l = x + 14, t = y - r.height / 2;
  if (l + r.width > innerWidth - 8) l = x - r.width - 14;
  tip.style.left = Math.max(8, l) + 'px';
  tip.style.top = Math.max(8, Math.min(innerHeight - r.height - 8, t)) + 'px';
}
const skjulTip = () => { tip.hidden = true; };
// Navne kommer udefra (Meta) -- derfor textContent og aldrig innerHTML i tooltippet
function el(tag, klasse, tekst) { const e = document.createElement(tag); if (klasse) e.className = klasse; if (tekst != null) e.textContent = tekst; return e; }
function tipLinje(farve, navn, vaerdi, stiplet) {
  const l = el('div', 't-linje');
  if (farve) { const s = el('span', 'streg' + (stiplet ? ' stiplet' : '')); if (farve !== 'x') s.style.borderColor = farve; l.appendChild(s); }
  l.appendChild(el('span', 'n', navn));
  l.appendChild(el('b', '', vaerdi));
  return l;
}

// ---------- Grafen: én linje pr. platform + samme platform i forrige periode (stiplet) ----------
let grafTilstand = null;
function grafData() {
  const p = periode(), dage = [];
  for (let i = 0; i < p.dage; i++) dage.push(plusDage(p.fra, i));
  const pl = RAEKKEFOELGE.filter(x => (platform === 'alle' || x === platform) && data.konti.some(k => k.platform === x));
  const opslag = (liste) => { const m = new Map(); liste.forEach(r => m.set(r.platform + '|' + r.dato, r[metrik])); return m; };
  const nu = opslag(data.serie), foer = opslag(data.serie_foer);
  const har = harForrige();
  const raekke = (m, x, forskyd) => dage.map(d => { const n = m.get(x + '|' + plusDage(d, forskyd)); return n == null ? null : Number(n); });
  const serier = pl.map(x => ({ id: x, navn: PLATFORM[x], farve: `var(--${x})`, v: raekke(nu, x, 0), f: har ? raekke(foer, x, -p.dage) : null }));
  const saml = (m, forskyd) => dage.map(d => { let s = null; pl.forEach(x => { const n = m.get(x + '|' + plusDage(d, forskyd)); if (n != null) s = (s || 0) + Number(n); }); return s; });
  return { dage, serier, total: saml(nu, 0), forrige: har ? saml(foer, -p.dage) : null, forskyd: -p.dage };
}
function paenTop(maks) {
  if (!(maks > 0)) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(maks))), n = maks / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 4 ? 4 : n <= 5 ? 5 : n <= 8 ? 8 : 10) * p;
}
function tegnGraf() {
  const g = grafData(), boks = $('#graf');
  $('#grafTitel').textContent = METRIK[metrik] + ' pr. dag';
  const flere = g.serier.length > 1;
  $('#forklaring').innerHTML = (flere ? g.serier.map(s => `<span><i class="streg" style="border-color:${s.farve}"></i>${esc(s.navn)}</span>`).join('') : '') +
    (g.forrige ? '<span><i class="streg stiplet"></i>Forrige periode</span>' : '');
  const alle = g.serier.flatMap(s => s.v.concat(s.f || [])).filter(n => n != null);
  if (!alle.length) { boks.innerHTML = '<div class="lille" style="padding:40px 0;text-align:center">Der er ingen tal for ' + esc(METRIK[metrik].toLowerCase()) + ' i perioden endnu.</div>'; $('#grafTabel').innerHTML = ''; grafTilstand = null; return; }

  const B = Math.max(320, boks.clientWidth), H = 280, V = 46, HO = 14, T = 12, BU = 26;
  const top = paenTop(Math.max(...alle)), n = g.dage.length;
  const x = i => V + (n < 2 ? (B - V - HO) / 2 : i * (B - V - HO) / (n - 1));
  const y = v => T + (H - T - BU) * (1 - v / top);
  const sti = v => { let d = '', pen = false; v.forEach((p, i) => { if (p == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p).toFixed(1); pen = true; }); return d; };
  let svg = `<svg viewBox="0 0 ${B} ${H}" role="img" tabindex="0" aria-label="${esc(METRIK[metrik])} pr. dag. Brug piletasterne for at se de enkelte dage.">`;
  for (let i = 0; i <= 4; i++) {
    const v = top * i / 4;
    svg += `<line x1="${V}" x2="${B - HO}" y1="${y(v)}" y2="${y(v)}" stroke="var(--gitter)"/><text x="${V - 8}" y="${y(v) + 4}" text-anchor="end">${kortTal(v)}</text>`;
  }
  const trin = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((B - V) / 90))));
  for (let i = 0; i < n; i += trin) if (n - 1 - i >= trin / 2) svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : 'middle'}">${datoKort(tilDato(g.dage[i]))}</text>`;
  svg += `<text x="${x(n - 1)}" y="${H - 6}" text-anchor="end">${datoKort(tilDato(g.dage[n - 1]))}</text>`;
  g.serier.forEach(s => { if (s.f) svg += `<path d="${sti(s.f)}" fill="none" stroke="${s.farve}" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/>`; });
  if (!flere && g.serier[0]) {
    // Flade under linjen -- kun naar der er én serie, og kun hvor der er sammenhaengende tal
    const v = g.serier[0].v; let a = '', start = -1;
    v.forEach((p, i) => { if (p != null && start < 0) start = i; if ((p == null || i === n - 1) && start >= 0) { const slut = p == null ? i - 1 : i; if (slut > start) a += `M${x(start)} ${y(0)}` + v.slice(start, slut + 1).map((q, j) => `L${x(start + j).toFixed(1)} ${y(q).toFixed(1)}`).join('') + `L${x(slut)} ${y(0)}Z`; start = -1; } });
    svg += `<path d="${a}" fill="${g.serier[0].farve}" opacity=".1"/>`;
  }
  g.serier.forEach(s => { svg += `<path d="${sti(s.v)}" fill="none" stroke="${s.farve}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`; });
  svg += `<line id="sigte" y1="${T}" y2="${H - BU}" stroke="var(--mut)" stroke-width="1" visibility="hidden"/>`;
  g.serier.forEach((s, j) => { svg += `<circle id="punkt${j}" r="4.5" fill="${s.farve}" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`; });
  boks.innerHTML = svg + '</svg>';

  const sv = boks.querySelector('svg');
  grafTilstand = { g, x, y, sv, B, V, HO, i: -1 };
  const tilIndeks = e => { const r = sv.getBoundingClientRect(); const px = (e.clientX - r.left) * B / r.width; return Math.max(0, Math.min(n - 1, Math.round((px - V) / ((B - V - HO) / Math.max(1, n - 1))))); };
  sv.addEventListener('pointermove', e => visPunkt(tilIndeks(e), e.clientY));
  sv.addEventListener('pointerleave', skjulPunkt);
  sv.addEventListener('blur', skjulPunkt);
  sv.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const i = grafTilstand.i < 0 ? n - 1 : Math.max(0, Math.min(n - 1, grafTilstand.i + (e.key === 'ArrowLeft' ? -1 : 1)));
    visPunkt(i);
  });

  $('#grafTabel').innerHTML = `<thead><tr><th>Dato</th>${g.serier.map(s => `<th>${esc(s.navn)}</th>${s.f ? `<th>${esc(s.navn)}, forrige periode</th>` : ''}`).join('')}${flere ? '<th>I alt</th>' + (g.forrige ? '<th>I alt, forrige periode</th>' : '') : ''}</tr></thead><tbody>` +
    g.dage.map((d, i) => `<tr><td>${datoKort(tilDato(d))}</td>${g.serier.map(s => `<td>${tal(s.v[i])}</td>${s.f ? `<td>${tal(s.f[i])}</td>` : ''}`).join('')}${flere ? `<td>${tal(g.total[i])}</td>` + (g.forrige ? `<td>${tal(g.forrige[i])}</td>` : '') : ''}</tr>`).join('') + '</tbody>';
}
function visPunkt(i, musY) {
  const t = grafTilstand; if (!t) return;
  t.i = i;
  const r = t.sv.getBoundingClientRect(), px = t.x(i);
  const sigte = t.sv.querySelector('#sigte');
  sigte.setAttribute('x1', px); sigte.setAttribute('x2', px); sigte.setAttribute('visibility', 'visible');
  t.g.serier.forEach((s, j) => {
    const c = t.sv.querySelector('#punkt' + j);
    if (s.v[i] == null) c.setAttribute('visibility', 'hidden');
    else { c.setAttribute('cx', px); c.setAttribute('cy', t.y(s.v[i])); c.setAttribute('visibility', 'visible'); }
  });
  const dato = tilDato(t.g.dage[i]);
  visTip(r.left + px * r.width / t.B, musY ?? r.top + r.height / 2, n => {
    n.appendChild(el('div', 't-titel', datoLang(dato)));
    const foerDato = datoKort(tilDato(plusDage(t.g.dage[i], t.g.forskyd)));
    t.g.serier.forEach(s => {
      n.appendChild(tipLinje(s.farve, s.navn, tal(s.v[i])));
      if (s.f) n.appendChild(tipLinje(s.farve, s.navn + ' ' + foerDato, tal(s.f[i]), true));
    });
    if (t.g.serier.length > 1) {
      const l = tipLinje(null, 'I alt', tal(t.g.total[i])); l.classList.add('t-sum'); n.appendChild(l);
      if (t.g.forrige) n.appendChild(tipLinje(null, 'I alt ' + foerDato, tal(t.g.forrige[i])));
    }

}
function skjulPunkt() {
  const t = grafTilstand; if (!t) return;
  t.i = -1;
  t.sv.querySelectorAll('#sigte,circle').forEach(e => e.setAttribute('visibility', 'hidden'));
  skjulTip();
}

// ---------- Butikker og konti ----------
const KOL = [['Følgere', 'foelgere'], ['Nye følgere', 'nye_foelgere'], ['Opslag', 'opslag'], ['Visninger', 'visninger'], ['Interaktioner', 'interaktioner'], ['Likes', 'likes'], ['Kommentarer', 'kommentarer']];
function tegnKonti() {
  const k = valgte();
  let r;
  if (visning === 'butik') {
    // Facebook-siden og Instagram-kontoen for samme butik hedder det samme hos Meta -- bortset
    // fra stavemaaden ("Borneloppen Liège" paa Instagram), saa der sammenlignes uden ø/accenter.
    const noegle = n => (n || '').toLowerCase().replace(/ø/g, 'o').normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    const m = new Map();
    k.forEach(x => {
      const nk = noegle(x.navn);
      if (!m.has(nk)) m.set(nk, { navn: x.navn, platforme: [], konti: [], nu: {}, foer: {} });
      const b = m.get(nk);
      if (x.platform === 'facebook') b.navn = x.navn;
      b.platforme.push(x.platform); b.konti.push(x);
      ['nu', 'foer'].forEach(t => KOL.forEach(([, f]) => { if (x[t][f] != null) b[t][f] = (b[t][f] || 0) + Number(x[t][f]); }));
    });
    r = [...m.values()];
  } else r = k.map(x => ({ navn: x.navn, brugernavn: x.brugernavn, platforme: [x.platform], konti: [x], nu: x.nu, foer: x.foer }));
  const s = sortering;
  r.sort((a, b) => s.felt === 'navn' ? a.navn.localeCompare(b.navn, 'da') * (s.ned ? -1 : 1) : ((b.nu[s.felt] ?? -1) - (a.nu[s.felt] ?? -1)) * (s.ned ? 1 : -1));
  tabelRaekker = r;
  $('#kontiAntal').textContent = r.length ? r.length + (visning === 'butik' ? (r.length === 1 ? ' butik' : ' butikker') : ' konti') : '';
  const celle = (x, f) => { const c = sammenlign(x.konti, f); return `<td>${tal(x.nu[f])}${!c ? '' : `<div class="lille"${c.uden ? ` title="Uden ${c.uden}, som ikke har tal for forrige periode"` : ''}>${pctHtml(c.pct)}${c.uden ? '*' : ''}</div>`}</td>`; };
  $('#konti').innerHTML = `<thead><tr><th data-felt="navn" class="${s.felt === 'navn' ? 'sorteret' : ''}">${visning === 'butik' ? 'Butik' : 'Konto'}${s.felt === 'navn' ? (s.ned ? ' ↓' : ' ↑') : ''}</th>${KOL.map(([n, f]) => `<th data-felt="${f}" class="${s.felt === f ? 'sorteret' : ''}">${n}${s.felt === f ? (s.ned ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead><tbody>${
    r.map(x => `<tr><td><div class="konto">${x.platforme.map(p => `<span class="prik ${p}" title="${PLATFORM[p]}"></span>`).join('')}<span>${esc(x.navn)}${x.brugernavn ? ` <span class="lille">@${esc(x.brugernavn)}</span>` : ''}</span></div></td>${KOL.map(([, f]) => celle(x, f)).join('')}</tr>`).join('')
    || `<tr><td colspan="${KOL.length + 1}" class="lille">Ingen konti endnu.</td></tr>`}</tbody>`;
}
function hentCsv() {
  const p = periode(), felt = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const linjer = [[visning === 'butik' ? 'Butik' : 'Konto', 'Platform', ...KOL.map(k => k[0])].map(felt).join(';')]
    .concat(tabelRaekker.map(x => [x.navn, x.platforme.map(q => PLATFORM[q]).join(' + '), ...KOL.map(([, f]) => x.nu[f] ?? '')].map(felt).join(';')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + linjer.join('\r\n')], { type: 'text/csv;charset=utf-8' }));

// ---------- Top-opslag ----------
async function hentOpslag() {
  const p = periode(), felt = $('#opslagSort').value;
  let o;
  if (LINK) {
    // Butikslinket faar sine top-opslag med i svaret fra serveren (det kan ikke laese tabellen selv)
    o = (data.opslag || []).filter(x => platform === 'alle' || x.some_konti.platform === platform).slice(0, 8);
  } else {
    let q = client.from('some_opslag')
      .select('ekstern_id,oprettet_at,tekst,permalink,billede_url,likes,kommentarer,delinger,visninger,some_konti!inner(navn,platform,aktiv,butik_id)')
      .eq('some_konti.aktiv', true)
      .or('type.is.null,type.neq.STORY')
      .gte('oprettet_at', p.fra).lt('oprettet_at', plusDage(p.til, 1))
      .order(felt, { ascending: false, nullsFirst: false }).limit(8);
    if (platform !== 'alle') q = q.eq('some_konti.platform', platform);
    if (butik) q = q.eq('some_konti.butik_id', butik);
    o = (await q).data;
  }
  $('#opslag').innerHTML = (o || []).map(x => {
    const inter = (x.likes || 0) + (x.kommentarer || 0) + (x.delinger || 0);
    const rate = x.visninger ? ` · ${(inter / x.visninger * 100).toLocaleString('da-DK', { maximumFractionDigits: 1 })}% engagement` : '';
    return `<div class="opslag">
    ${x.billede_url ? `<img src="${esc(x.billede_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=tom></div>'">` : '<div class="tom"></div>'}
    <a href="${esc(/^https:\/\//.test(x.permalink || '') ? x.permalink : '#')}" target="_blank" rel="noopener"><div class="lille"><span class="prik ${x.some_konti.platform}"></span> ${esc(x.some_konti.navn)}, ${datoKort(new Date(x.oprettet_at))}</div><div class="tekst">${esc(x.tekst || '(uden tekst)')}</div></a>
    <div class="tal2"><b>${tal(x.likes)}</b> likes · ${tal(x.kommentarer)} komm.<br>${x.visninger != null ? kortTal(x.visninger) + ' visninger' + rate : '&nbsp;'}</div>
  </div>`; }).join('') || '<div class="lille">Ingen opslag i perioden endnu.</div>';
}

// ---------- Hvornår klarer opslag sig bedst? ----------
function tegnTider() {
  const celler = UGEDAGE.map(() => BLOKKE.map(() => ({ antal: 0, inter: 0 })));
  data.tider.forEach(t => {
    if (platform !== 'alle' && t.platform !== platform) return;
    const b = BLOKKE.findIndex(([a, z]) => t.time >= a && t.time < z), c = celler[t.ugedag - 1] && celler[t.ugedag - 1][b];
    if (c) { c.antal += t.antal; c.inter += Number(t.interaktioner || 0); }
  });
  const snit = c => c.antal ? c.inter / c.antal : 0;
  const maks = Math.max(1, ...celler.flat().map(snit));
  const blokNavn = ([a, z]) => String(a).padStart(2, '0') + '–' + String(z).padStart(2, '0');
  let h = '<div></div>' + BLOKKE.map(b => `<div class="akse top">${blokNavn(b)}</div>`).join('');
  celler.forEach((raekke, d) => {
    h += `<div class="akse">${UGEDAGE[d].slice(0, 3)}</div>`;
    raekke.forEach((c, b) => {
      if (!c.antal) { h += '<div class="celle"></div>'; return; }
      // Én farve fra lys til moerk: jo flere interaktioner pr. opslag, jo kraftigere
      const styrke = Math.round(12 + 88 * snit(c) / maks);
      h += `<button type="button" class="celle har" data-d="${d}" data-b="${b}" style="background:color-mix(in srgb, var(--varme) ${styrke}%, var(--card));color:${styrke > 55 ? 'var(--card)' : 'var(--fg)'}" aria-label="${UGEDAGE[d]} ${blokNavn(BLOKKE[b])}: ${tal(snit(c))} interaktioner pr. opslag, ${c.antal} opslag">${kortTal(Math.round(snit(c)))}</button>`;
    });
  });
  const kort = $('#varmekort');
  kort.innerHTML = h;
  const visCelle = e => {
    const k = e.target.closest('.celle.har'); if (!k) return;
    const c = celler[k.dataset.d][k.dataset.b], r = k.getBoundingClientRect();
    visTip(r.right - 6, r.top + r.height / 2, n => {
      n.appendChild(el('div', 't-titel', UGEDAGE[k.dataset.d] + ' kl. ' + blokNavn(BLOKKE[k.dataset.b])));
      n.appendChild(tipLinje(null, 'Interaktioner pr. opslag', tal(snit(c))));
      n.appendChild(tipLinje(null, 'Opslag', tal(c.antal)));
    });
  };
  kort.onpointerover = visCelle; kort.onfocusin = visCelle;
  kort.onpointerleave = skjulTip; kort.onfocusout = skjulTip;
  // Et enkelt opslag der gik godt er ikke et moenster -- top 3 kraever mindst 3 opslag
  const top = celler.flatMap((raekke, d) => raekke.map((c, b) => ({ d, b, c }))).filter(x => x.c.antal >= 3).sort((a, z) => snit(z.c) - snit(a.c)).slice(0, 3);
  $('#bedst').innerHTML = top.map(x => `<li>${UGEDAGE[x.d]} kl. ${blokNavn(BLOKKE[x.b])}: <b>${tal(snit(x.c))}</b> interaktioner pr. opslag <span class="lille">(${x.c.antal} opslag)</span></li>`).join('')
    || '<li class="lille">Der er for få opslag i perioden til at pege på et bedste tidspunkt.</li>';
}

// ---------- Betjening ----------
$('#periode').addEventListener('change', hent);
$('#platforme').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; platform = b.dataset.p; tegn(); });
$('#metrikker').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; metrik = b.dataset.m; $('#metrikker').querySelectorAll('.chip').forEach(c => c.classList.toggle('aktiv', c === b)); tegnGraf(); });
$('#visninger').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; visning = b.dataset.v; $('#visninger').querySelectorAll('.chip').forEach(c => c.classList.toggle('aktiv', c === b)); tegnKonti(); });
$('#konti').addEventListener('click', e => {
  const th = e.target.closest('th[data-felt]'); if (!th) return;
  sortering = { felt: th.dataset.felt, ned: sortering.felt === th.dataset.felt ? !sortering.ned : th.dataset.felt !== 'navn' };
  tegnKonti();
});
$('#csv').addEventListener('click', hentCsv);
$('#opslagSort').addEventListener('change', () => LINK ? hent() : hentOpslag());
$('#omfang').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; omfang = b.dataset.o; $('#omfang').querySelectorAll('.chip').forEach(c => c.classList.toggle('aktiv', c === b)); hent(); });
$('#butik').addEventListener('change', e => { butik = e.target.value || null; hent(); });
// Friske tal: naar siden aabnes -- og hvert 5. minut mens den er aaben og synlig -- hentes nye
// tal fra Meta, hvis den seneste indsamling er mere end 5 minutter gammel. Tidsstemplet ligger
// i databasen og deles af alle, saa flere aabne faner ikke starter hver sin indsamling. Der
// hentes intet, mens fanen er skjult (log-kvoten).
const FRISK_MS = 5 * 60 * 1000;
let opdaterer = false;
async function opdater(manuel) {
  if (opdaterer) return;
  const s = data && data.sidste_sync;
  if (!manuel && s && s.startet_at && Date.now() - new Date(s.startet_at).getTime() < FRISK_MS) return;
  opdaterer = true;
  const k = $('#opdater');
  k.disabled = true; k.textContent = 'Henter…';
  const { data: r, error } = await client.functions.invoke('some-sync', { body: LINK ? { k: LINK } : manuel ? { tving: true } : {} });
  k.disabled = false; k.textContent = 'Opdater nu';
  opdaterer = false;
  if (manuel && (error || !r || r.fejl)) { besked((r && r.fejl) || 'De nye tal kunne ikke hentes lige nu. Prøv igen om lidt.', true); return; }
  await hent();
}
const synlig = () => !document.hidden && innerWidth > 0; // 0 = iframen er skjult bag en anden fane
$('#opdater').addEventListener('click', () => opdater(true));
setInterval(() => { if (synlig() && data) hent().then(() => opdater(false)); }, FRISK_MS);
document.addEventListener('visibilitychange', () => { if (synlig() && data) opdater(false); });
// Grafen tegnes i rigtige pixels (saa tekst ikke straekkes) og tegnes derfor om, naar bredden aendres
let bredde = 0;
new ResizeObserver(() => { const b = $('#graf').clientWidth; if (data && b && Math.abs(b - bredde) > 4) { bredde = b; skjulTip(); tegnGraf(); } }).observe($('#graf'));
window.addEventListener('scroll', skjulTip, true);

async function start() {
  if (LINK) { vis('app'); await hent(); if (data) opdater(false); return; }
  const { data: { user } } = await client.auth.getUser();
  if (!user) { vis('ingenAdgangVis'); return; }
  // RLS paa some_adgang viser kun brugerens egen raekke -- findes den ikke, er der ingen adgang.
  const { data: adg } = await client.from('some_adgang').select('bruger_id').eq('bruger_id', user.id).maybeSingle();
  if (!adg) { vis('ingenAdgangVis'); return; }
  vis('app');
  await hent();
  opdater(false);
}
if (window.top !== window || LINK) start().catch(() => vis(LINK ? 'ugyldigtLinkVis' : 'ingenAdgangVis'));
</script>
</body></html>
