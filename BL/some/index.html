<script>
// SoMe-siden vises inde i butik-redigerings "SoMe"-fane (en iframe under samme topbar, ligesom
// vagtplanen). Aabnes den direkte, sendes man derhen i stedet -- medmindre adressen er et
// butikslink (?k=...), som vises uden login og kun med den butiks tal + kaedens samlede tal.
if (window.top === window && !new URLSearchParams(location.search).get('k')) location.replace('../butik-redigering/#some');
// Tema (system/lys/moerk) deles med butik-redigering via localStorage 'blho-tema'.
const systemMoerk = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function saetTema() {
  let valg = 'system';
  try { const v = localStorage.getItem('blho-tema'); if (v === 'lys' || v === 'moerk') valg = v; } catch (e) {}
  const moerk = valg === 'moerk' || (valg === 'system' && !!systemMoerk && systemMoerk.matches);
  document.documentElement.setAttribute('data-tema', moerk ? 'moerk' : 'lys');
}
saetTema();
window.addEventListener('storage', e => { if (e.key === 'blho-tema') saetTema(); });
if (systemMoerk && systemMoerk.addEventListener) systemMoerk.addEventListener('change', saetTema);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Samme farve-variabler som vagtplanen, saa de to faner ligner hinanden i lys og moerk tilstand.
   Platformenes farver (--facebook/--instagram) er valgt saa de kan skelnes ved farveblindhed og
   har kontrast nok mod kortets flade i begge temaer -- skift dem ikke uden at tjekke det igen. */
:root{--bg:#f4f4f2;--fg:#1a1a1a;--mut:#6c6577;--card:#fff;--bd:#e2e2e2;--gitter:#ececec;--felt:#ddd;--bad:#c93a3a;--ok:#2b8a4f;--brand:#040DB1;--brand-tekst:#040DB1;--badge:#eef0fd;--fejl-bg:#fdecea;--fejl:#b92a15;--facebook:#1877F2;--instagram:#D93175;--tiktok:#241F21;--varme:#040DB1;color-scheme:light}
:root[data-tema="moerk"]{--bg:#15161b;--fg:#e8e8ee;--mut:#9a9cab;--card:#1e2029;--bd:#3a3d4a;--gitter:#2b2e39;--felt:#4a4d5a;--bad:#ff7a7a;--ok:#6fd49a;--brand:#3d47e0;--brand-tekst:#9aa6ff;--badge:#262b4d;--fejl-bg:#3a2023;--fejl:#ff7b6b;--facebook:#3b82f6;--instagram:#e0508c;--tiktok:#d0d0d8;--varme:#8a97ff;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);margin:0;color:var(--fg);font-size:15px;line-height:1.4}
.indhold{padding:16px 20px 48px;max-width:1320px;margin:0 auto;transition:opacity .15s}
.indhold.henter{opacity:.55}
.laeser{text-align:center;color:var(--mut);padding:20vh 20px}
/* Spinneren ligger OVER siden, saa den ogsaa daekker den tomme side, mens de foerste tal hentes */
#laeserVis{position:fixed;inset:0;z-index:50;background:var(--bg);padding:0;display:grid;place-content:center;justify-items:center;gap:14px;font-size:13px}
.spinner{width:44px;height:44px;animation:drej 2s linear infinite}
.spinner circle{fill:none;stroke:var(--bd);stroke-width:4}
.spinner .bue{stroke:var(--brand-tekst);stroke-linecap:round;animation:straek 1.5s ease-in-out infinite}
@keyframes drej{to{transform:rotate(360deg)}}
@keyframes straek{0%{stroke-dasharray:1 150;stroke-dashoffset:0}50%{stroke-dasharray:90 150;stroke-dashoffset:-35}100%{stroke-dasharray:90 150;stroke-dashoffset:-124}}
.hoved{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px}
.hoved h1{font-size:20px;margin:0;color:var(--brand-tekst)}
.hoved #periodeTekst{flex-basis:100%;font-size:12px;margin-top:-4px}
/* Butik og periode foelger med ned, naar man ruller (ikke paa telefon, hvor det fylder for meget) */
@media (min-width:761px){.hoved{position:sticky;top:0;z-index:20;background:var(--bg);margin:-16px -20px 16px;padding:12px 20px 10px;border-bottom:1px solid var(--bd)}}
.datoer{display:inline-flex;align-items:center;gap:6px;color:var(--mut)}
.luft{flex:1}
select,button,input{font-family:inherit;font-size:13px}
select,input[type=date]{padding:7px 10px;border:1px solid var(--felt);border-radius:8px;background:var(--card);color:var(--fg)}
.knap{padding:7px 14px;border:none;border-radius:8px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.knap:disabled{opacity:.5;cursor:default}
.knap.stille{background:var(--badge);color:var(--brand-tekst)}
:focus-visible{outline:2px solid var(--brand-tekst);outline-offset:2px}
.chips{display:inline-flex;background:var(--badge);border-radius:20px;padding:3px;gap:2px}
.chip{background:none;border:none;color:var(--brand-tekst);font-weight:700;font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer}
.chip.aktiv{background:var(--brand);color:#fff}
.status{font-size:12px;color:var(--mut)}.status.bad{color:var(--bad)}
.kort{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}
.kort-hoved{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.kort h2{font-size:15px;margin:0}
.kort h2 small{font-weight:400;color:var(--mut);margin-left:6px}
.to{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.to>.kort{margin-bottom:16px}
.noegletal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1100px){.noegletal{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tal{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.tal .navn{font-size:12px;font-weight:600;color:var(--mut)}
.tal .vaerdi{font-size:23px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.aendring{font-size:12px;color:var(--mut)}
.op{color:var(--ok);font-weight:700}.ned{color:var(--bad);font-weight:700}
/* --- Grafen --- */
.forklaring{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--mut)}

.streg{display:inline-block;width:16px;height:0;border-top:2px solid}

#graf{position:relative}

#tip{position:fixed;z-index:50;pointer-events:none;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:10px 12px;font-size:12px;min-width:150px;max-width:260px}

[data-tip]{cursor:help}th[data-tip]{cursor:pointer}
#tip .t-linje{display:flex;align-items:center;gap:8px;line-height:1.7}

details.tabelvisning{margin-top:10px;font-size:12px}
details.tabelvisning summary{cursor:pointer;color:var(--mut)}
details.tabelvisning .rul{max-height:260px;overflow:auto;margin-top:8px}
/* --- Tabeller --- */
.rul{overflow-x:auto}

th{font-size:12px;color:var(--mut);font-weight:600}
th[data-felt]{cursor:pointer;user-select:none}

tbody tr:hover td{background:var(--badge)}

.konto{display:flex;align-items:center;gap:8px}
.prik{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.prik.facebook{background:var(--facebook)}.prik.instagram{background:var(--instagram)}.prik.tiktok{background:var(--tiktok)}
.lille{font-size:11px;color:var(--mut)}
/* --- Top-opslag --- */
.opslag{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.opslag:last-child{border-bottom:none}
.opslag img,.opslag .tom{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--badge)}
.opslag .tekst{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px}
.opslag a{color:inherit;text-decoration:none;min-width:0}.opslag a:hover .tekst{text-decoration:underline}
.opslag .tal2{text-align:right;font-size:12px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}

/* --- Bedste tidspunkt --- */
.varmekort{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:2px;font-size:11px}
.varmekort .akse{color:var(--mut);padding:2px 6px 2px 0;display:flex;align-items:center}

.celle{height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:var(--gitter);color:var(--mut);border:0;padding:0;font-size:11px;font-family:inherit}

.celle.har:hover,.celle.har:focus-visible{outline:2px solid var(--fg);outline-offset:0}
.bedst{margin:12px 0 0;padding:0;list-style:none;font-size:13px}
.bedst li{padding:2px 0}.bedst b{font-variant-numeric:tabular-nums}
/* --- Sektion pr. platform: indsats og resultat, som i de maanedlige rapporter --- */
.pf-titel{display:flex;align-items:center;gap:8px;font-size:17px;margin:22px 0 10px}
.pf-titel .prik{width:12px;height:12px}
.pf-tal{display:flex;flex-wrap:wrap;gap:12px 24px;margin-bottom:16px}
.gruppe{min-width:0;flex:var(--n) 1 calc(var(--n) * 140px)}
.gruppe h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 6px;font-weight:700}
.gruppe .noegletal{grid-template-columns:repeat(var(--n),minmax(0,1fr));margin-bottom:0}
.pf[data-p="facebook"] .tal{border-top:3px solid var(--facebook)}
.pf[data-p="instagram"] .tal{border-top:3px solid var(--instagram)}
.tal .hint{font-size:11px;color:var(--mut);margin-top:2px}
.to.en{grid-template-columns:minmax(0,1fr)}
.foelgerTal{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:0}
.celle.tom{color:var(--felt)}
/* De tre bedste tidspunkter: samme farve i feltet og i listen under kortet (tallet 1-3 staar
   der ogsaa, saa det ikke kun er farven, der baerer det). Felter med faerre end 3 opslag er graa. */
.celle.r1,.rang.r1{background:#15803d;color:#fff}
.celle.r2,.rang.r2{background:#4ade80;color:#062b14}
.celle.r3,.rang.r3{background:#bbf7d0;color:#062b14}
.celle.r1,.celle.r2,.celle.r3{font-weight:700}
.celle.faa{background:var(--gitter);color:var(--mut)}
.rang{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;font-size:11px;font-weight:700;margin-right:8px;vertical-align:1px}
/* --- Rapporten: tekst fra den SoMe-ansvarlige, laast til en periode --- */
.rapport{background:color-mix(in srgb,var(--ok) 9%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 32%,var(--bd));border-radius:14px;padding:16px 18px;margin-bottom:18px}
.rapport-tom{background:none;border-style:dashed;border-color:var(--bd)}
.rapport-hoved{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.rapport-hoved+h2,.rapport-hoved+.rapport-tekst,.rapport-hoved+input{margin-top:10px}
.rapport-maerke{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.rapport h2{font-size:18px;margin:0 0 6px}
.rapport-tekst{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.6}
.rapport-faelles{margin-top:14px;padding-top:12px;border-top:1px dashed color-mix(in srgb,var(--ok) 32%,var(--bd))}
.rapport-faelles .rapport-maerke{display:block;margin-bottom:6px}
.rapport-note{font-size:12px;color:var(--mut);margin-top:10px}
.rapport input[type=text],.rapport textarea{display:block;width:100%;padding:9px 12px;border:1px solid var(--felt);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
.rapport input[type=text]{font-weight:600;margin-bottom:8px}
.rapport textarea{min-height:190px;resize:vertical;font-size:15px;line-height:1.55}
.rapport-knapper{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:12px}
.rapport-knapper .rapport-note{margin:0}
.knap.fare{color:var(--bad)}
.emoji-linje{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:8px}
.emoji-linje .rapport-note{margin:0}
.emoji-panel{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.emoji-gruppe{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.emoji-gruppe>span{font-size:11px;color:var(--mut);width:96px;flex:none}
.emoji{border:0;background:none;font-size:20px;line-height:1;padding:5px;border-radius:6px;cursor:pointer;font-family:inherit}
.emoji:hover,.emoji:focus-visible{background:var(--badge)}
.knap.stille.aktiv{background:var(--brand);color:#fff}
.rapport-note b{color:var(--fg)}
.emoji-panel .rapport-note{margin:0 0 4px}
.linkknap.fare{color:var(--bad)}
.tidligere{margin-top:14px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--ok) 32%,var(--bd));font-size:13px}
.tidligere summary{cursor:pointer;color:var(--mut);font-weight:600}
.tidl{margin-top:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.tidl-hoved{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.tidl-titel{font-weight:600;margin-top:4px}
.tidl .rapport-tekst{font-size:13px;line-height:1.5;margin-top:4px;color:var(--mut)}
.linkknap{background:none;border:0;padding:0;color:var(--brand-tekst);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
/* --- Opslagene bag et felt i "Bedste tidspunkter" --- */
dialog.tid{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--fg);padding:0;width:min(760px,calc(100vw - 24px));max-height:min(82vh,820px);overflow:auto}
dialog.tid::backdrop{background:rgba(0,0,0,.5)}
.tid-hoved{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--card);z-index:1}

.besked{background:var(--badge);color:var(--brand-tekst);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:14px}
.besked.fejl{background:var(--fejl-bg);color:var(--fejl)}
@media (max-width:900px){.to{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.noegletal,.gruppe .noegletal,.foelgerTal{grid-template-columns:repeat(2,minmax(0,1fr))}.gruppe{flex-basis:100%}.indhold{padding:12px}.opslag{grid-template-columns:44px 1fr}.opslag img,.opslag .tom{width:44px;height:44px}.opslag .tal2{grid-column:2;text-align:left}}
@media (prefers-reduced-motion:reduce){.indhold{transition:none}.spinner .bue{animation:none;stroke-dasharray:60 150}}
</style></head><body>

<script>
// Tallene ligger i Supabase (some_konti, some_dag, some_opslag) bag RLS, der kun lukker brugere
// i `some_adgang` ind. De hentes fra Meta én gang i doegnet af edge-funktionen some-sync --
// denne side taler aldrig selv med Facebook/Instagram og indeholder ingen noegler.
// Der hentes kun data, naar siden aabnes eller perioden skiftes (ingen polling -- log-kvoten).
const SUPABASE_URL = 'https://irijatnmgvutrqngwpaa.supabase.co';

const tilStreng = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const tilDato = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };

// Datoer vises altid med aarstal (der sammenlignes paa tvaers af aar). Kun grafens akse, hvor

// Samme dato aaret foer (29. februar bliver til 28.) -- samme regel som Postgres' "- interval '1 year'"
const aarFoer = d => { const t = tilDato(d), r = new Date(t.getFullYear() - 1, t.getMonth(), t.getDate()); if (r.getMonth() !== t.getMonth()) r.setDate(0); return tilStreng(r); };

// Perioden slutter i gaar: dagens tal er ikke faerdige foer i morgen. Der sammenlignes med samme
// datoer aaret foer -- eller, hvis man vaelger det, med perioden lige foer: lige saa mange dage,
// eller hele maaneden foer, naar perioden er en hel kalendermaaned. Siden sender selv
// sammenligningsperioden til serveren, saa de to altid er enige.
function periode() {
  const idag = new Date();
  let til = new Date(idag.getFullYear(), idag.getMonth(), idag.getDate() - 1), fra;
  const v = $('#periode').value;
  if (v === 'maaned') { fra = new Date(idag.getFullYear(), idag.getMonth() - 1, 1); til = new Date(idag.getFullYear(), idag.getMonth(), 0); }
  else if (v === 'denne') fra = new Date(til.getFullYear(), til.getMonth(), 1);
  else if (v === 'kvartal') { const k = Math.floor(idag.getMonth() / 3); fra = new Date(idag.getFullYear(), (k - 1) * 3, 1); til = new Date(idag.getFullYear(), k * 3, 0); }
  else if (v === 'dettekvartal') fra = new Date(til.getFullYear(), Math.floor(til.getMonth() / 3) * 3, 1);
  else if (v.startsWith('k:')) {
    // Et bestemt kvartal ("k:2026-3"); er det ikke slut endnu, vises det til og med i gaar
    const [aar, kv] = v.slice(2).split('-').map(Number), slut = new Date(aar, kv * 3, 0);
    fra = new Date(aar, (kv - 1) * 3, 1);
    if (slut < til) til = slut;
  }
  else if (v === 'aar') fra = new Date(til.getFullYear(), 0, 1);
  else if (v === 'valgfri' && $('#fraDato').value && $('#tilDato').value) {
    // Egne datoer: aldrig senere end i gaar, og hoejst 400 dage (serverens graense)
    let a = tilDato($('#fraDato').value), b = tilDato($('#tilDato').value);
    if (a > b) [a, b] = [b, a];
    if (b > til) b = til;
    if (a > b) a = b;
    if (Math.round((b - a) / 864e5) > 400) a = new Date(b.getFullYear(), b.getMonth(), b.getDate() - 400);
    fra = a; til = b;
  }
  else fra = new Date(til.getFullYear(), til.getMonth(), til.getDate() - ((Number(v) || 28) - 1));
  const dage = Math.round((til - fra) / 864e5) + 1;
  const ud = { fra: tilStreng(fra), til: tilStreng(til), dage };
  if (sammenligning === 'aar' && dage <= 365) {
    // foerDag: hvilken dag i sammenligningsperioden, en dag i perioden svarer til (til grafen)
    return { ...ud, foerFra: aarFoer(ud.fra), foerTil: aarFoer(ud.til), foerDag: aarFoer };
  }
  const helMaaned = fra.getDate() === 1 && fra.getMonth() === til.getMonth() && fra.getFullYear() === til.getFullYear()
    && new Date(til.getFullYear(), til.getMonth(), til.getDate() + 1).getDate() === 1;
  // Et helt kvartal sammenlignes med hele kvartalet foer, en hel maaned med hele maaneden foer
  const helKvartal = fra.getDate() === 1 && fra.getMonth() % 3 === 0 && til.getFullYear() === fra.getFullYear() && til.getMonth() === fra.getMonth() + 2
    && new Date(til.getFullYear(), til.getMonth(), til.getDate() + 1).getDate() === 1;
  const foerFra = helKvartal ? new Date(fra.getFullYear(), fra.getMonth() - 3, 1)
    : helMaaned ? new Date(fra.getFullYear(), fra.getMonth() - 1, 1) : new Date(fra.getFullYear(), fra.getMonth(), fra.getDate() - dage);
  const forskyd = -Math.round((fra - foerFra) / 864e5);
  return { ...ud, foerFra: tilStreng(foerFra), foerTil: plusDage(ud.fra, -1), foerDag: d => plusDage(d, forskyd) };
}

// Mens der hentes, bliver den gamle visning staaende (lidt nedtonet), saa siden ikke hopper.

let hentNr = 0, opslagNr = 0;

function beregnSamlede(konti) {
  konti.forEach(k => {
    ['nu', 'foer'].forEach(t => {
      const dele = [k[t].opslag_visninger, k[t].reel_visninger, k[t].story_visninger];
      k[t].samlede_visninger = k.platform === 'facebook' ? k[t].visninger
        : dele.every(v => v == null) ? null : dele.reduce((a, v) => a + Number(v || 0), 0);
    });
    if (k.platform !== 'facebook' && k.nu.story_visninger != null && k.foer.story_visninger == null) k.foer.samlede_visninger = null;
  });
}

// Sammenligningen vises kun, naar der findes tal for HELE den forrige periode -- ellers
// sammenlignes en fuld periode med et par dage, og procenterne bliver meningsloese.
function harForrige() {
  const p = periode();
  return !!data.foerste_dato && data.foerste_dato <= p.foerFra;
}
// Sammenligner kun de konti, der har tal i BEGGE perioder -- ellers ligner det en stor
// stigning, naar en konto bare mangler historik (fx Instagrams foelgertal, som Meta kun
// udleverer 30 dage tilbage). Tal der taelles ud fra opslag (opslag, likes, kommentarer) er
// noget andet: ingen opslag i forrige periode er et rigtigt 0, ikke manglende historik.
const FRA_OPSLAG = ['opslag', 'reels', 'opslag_visninger', 'reel_visninger', 'likes', 'kommentarer', 'delinger'];
// (stories er ikke med: for en konto uden historik betyder 'ingen' manglende tal, ikke nul)
function sammenlign(konti, felt) {
  if (!harForrige()) return null;
  const nul = FRA_OPSLAG.includes(felt);
  let nu = 0, foer = 0, med = 0; const ude = [];
  konti.forEach(k => {
    const a = k.nu[felt] ?? (nul ? 0 : null), b = k.foer[felt] ?? (nul ? 0 : null);
    if (a != null && b != null) { nu += Number(a); foer += Number(b); med++; }
    else if (a != null) ude.push(k);
  });
  if (!med || !(foer > 0)) return null;
  // "uden Instagram" kun naar hele platformen mangler -- ellers antallet af konti
  const helt = RAEKKEFOELGE.filter(p => ude.some(k => k.platform === p) && !konti.some(k => k.platform === p && !ude.includes(k)));
  const rest = ude.filter(k => !helt.includes(k.platform)).length;
  const uden = [...helt.map(p => PLATFORM[p]), ...(rest ? [rest + (rest === 1 ? ' konto' : ' konti')] : [])].join(' og ');
  return { pct: (nu - foer) / foer * 100, foer, uden };
}
function pctHtml(p) {
  if (p == null) return '';
  const kl = p > 0.05 ? 'op' : p < -0.05 ? 'ned' : '';
  return `<span class="${kl}">${p > 0.05 ? '▲' : p < -0.05 ? '▼' : ''} ${Math.abs(p).toLocaleString('da-DK', { maximumFractionDigits: 1 })}%</span>`;
}

function tegn() {
  $('#metrikker').innerHTML = Object.entries(METRIK).map(([k, n]) => `<button type="button" class="chip${k === metrik ? ' aktiv' : ''}" data-m="${k}">${n}</button>`).join('');

    $('#titel').textContent = omfang === 'faelles' ? 'Alle butikker' : butikNavn(data.butik);
    $('#omfang').hidden = false;
    $('#omfang').querySelector('[data-o="egen"]').textContent = butikNavn(data.butik);
    $('#opdater').hidden = true;
  } else {
    const valg = $('#butik'), liste = data.butikker || [];
    valg.hidden = liste.length < 2;
    valg.textContent = '';
    [{ id: '', navn: 'Alle butikker' }, ...liste].forEach(b => { const o = el('option', '', butikNavn(b.navn)); o.value = b.id; valg.appendChild(o); });
    valg.value = butik || '';
  }

  const s = data.sidste_sync;
  // Hvad der gik galt, er kun noget for den SoMe-ansvarlige (som ogsaa faar alarmen oeverst paa admin-siden)
  if (s && s.ok === false) besked(LINK || !kanStyre ? 'De nyeste tal kunne ikke hentes. Tallene nedenfor er fra sidste vellykkede indsamling.'
    : 'Den seneste indsamling fejlede: ' + ((data.sync_fejl && data.sync_fejl[0]) || 'ukendt fejl') + ' Tallene nedenfor er fra sidste vellykkede indsamling.', true);
  else if (!data.konti.length) besked(LINK ? 'Der er ikke koblet nogen Facebook- eller Instagram-konti til butikken endnu.'
    : 'Der er ikke hentet nogen tal endnu. Tryk "Opdater nu" for at hente dem – ellers hentes de automatisk hver morgen.');
  else if (!harForrige()) besked('Der er ingen tal fra ' + foerNavn().toLowerCase() + ' at sammenligne med' + (sammenligning === 'aar' ? ' – tallene går ikke så langt tilbage. Vælg "Sammenlign med perioden før" øverst for at se udviklingen.' : '. Prøv en kortere periode.'));
  else besked('');
  $('#status').textContent = s && s.afsluttet_at ? 'Opdateret ' + new Date(s.afsluttet_at).toLocaleString('da-DK', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  $('#status').classList.toggle('bad', !!s && s.ok === false);

  // Sig lige ud, hvilke datoer der vises, og hvad pilene sammenligner med ("▼ 10 % fra 817.110"
  // er det samme tal i sammenligningsperioden)
  const p = periode(), dato = d => datoKort(tilDato(d));

  forrigeTekst = harForrige() ? dato(p.foerFra) + ' – ' + dato(p.foerTil) : '';
  $('#periodeTekst').textContent = 'Viser ' + nuTekst +
    (forrigeTekst ? '  ·  Pilene og "fra"-tallene sammenligner med ' + foerNavn().toLowerCase() + ': ' + forrigeTekst : '');

  tegnRapport();
  tegnSektioner();
  tegnFoelgere();
  tegnGraf();
  tegnKonti();
  tegnTider();
  hentOpslag();
}

// ---------- Rapporten: tekst fra den SoMe-ansvarlige, laast til en periode ----------
// Hver butik har hoejst én aktiv rapport (og der er hoejst én faelles til alle butikker). Rapporten
// husker den periode, den blev gemt med: butikslinket aabner paa den, og modtageren kan derefter
// selv vaelge en anden. Gemmes rapporten med en ny periode, bliver den gamle til en "tidligere
// rapport" (arkiveret_at), som stadig kan ses -- og slettes af den SoMe-ansvarlige, der skriver
// og retter i fanen.
const datoTekst = d => datoKort(tilDato(d));
// "september 2026" for en hel kalendermaaned, "3. kvartal 2026" for et helt kvartal, ellers datoerne
function periodeNavn(fra, til) {
  const a = tilDato(fra), b = tilDato(til);
  if (a.getDate() === 1 && a.getMonth() % 3 === 0 && b.getFullYear() === a.getFullYear() && b.getMonth() === a.getMonth() + 2
    && new Date(b.getFullYear(), b.getMonth(), b.getDate() + 1).getDate() === 1) return (a.getMonth() / 3 + 1) + '. kvartal ' + a.getFullYear();
  const helMaaned = a.getDate() === 1 && a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear() && new Date(b.getFullYear(), b.getMonth(), b.getDate() + 1).getDate() === 1;
  return helMaaned ? a.toLocaleDateString('da-DK', { month: 'long', year: 'numeric' }) : datoTekst(fra) + ' – ' + datoTekst(til);
}
const butikNavnAf = id => String(((data && data.butikker || []).find(b => b.id === id) || {}).navn || 'butikken').replace(/^Butik\s+/, 'Børneloppen ');
async function hentRapporter() {

  rapporter = Array.isArray(r) ? r : [];
}
// Rapporterne for det, man kigger paa: butikkens egne, og de faelles til alle butikker
const faellesListe = () => rapporter.filter(r => !r.butik_id);
const egenListe = () => LINK ? (omfang === 'faelles' ? [] : rapporter.filter(r => r.butik_id)) : butik ? rapporter.filter(r => r.butik_id === butik) : [];
const aktiv = liste => liste.find(r => !r.arkiveret_at) || null;
const faellesRapport = () => aktiv(faellesListe());
const egenRapport = () => aktiv(egenListe());
// Det, der kan vaelges imellem i rapportboksen: butikkens rapporter, ellers de faelles
const visListe = () => egenRapport() ? egenListe() : faellesListe();
// Den rapport, der vises lige nu: en tidligere, hvis man har valgt én, ellers den aktive
const vistNu = () => visListe().find(r => r.id === vistRapport) || egenRapport() || faellesRapport();
// Saetter periodevaelgeren til bestemte datoer -- som et af de faste valg ("Sidste måned",

function saetPeriode(fra, til) {
  const v = $('#periode');
  const fast = [...v.options].map(o => o.value).filter(x => x !== 'valgfri').find(x => { v.value = x; const p = periode(); return p.fra === fra && p.til === til; });
  if (!fast) { v.value = 'valgfri'; $('#fraDato').value = fra; $('#tilDato').value = til; }
  visDatoer();
}

const gemtRapport = n => rapporter.find(r => (r.butik_id || 'alle') === n && !r.arkiveret_at) || null;

function gemKladde() {

// Det, AI'en faar at skrive ud fra -- alt, hvad siden ved om butikken i perioden: noegletallene med

  if (butik) {
    const { data: k } = await client.rpc('some_overblik2', { p_fra: p.fra, p_til: p.til, p_butik: null, p_f_fra: p.foerFra, p_f_til: p.foerTil });
    if (k && Array.isArray(k.konti)) { beregnSamlede(k.konti); kaede = k.konti; }
  }
  for (const pf of RAEKKEFOELGE) {
    const k = data.konti.filter(x => x.platform === pf);

    const ord = pf === 'instagram' ? 'opslag og reels' : 'opslag';
    linjer.push('', '=== ' + PLATFORM[pf].toUpperCase() + ' ===', 'Nøgletal (denne periode | før | ændring):');
    [...SEKTION[pf].indsats, ...SEKTION[pf].resultat, ['Interaktioner på kontoen (reaktioner, kommentarer, delinger og klik)', 'interaktioner'], ['Følgere i alt ved periodens slutning', 'foelgere'], ['Nye følgere i løbet af perioden', 'nye_foelgere']].forEach(([navn, felt]) => {
      const nu = sum(k, 'nu', felt) ?? (FRA_OPSLAG.includes(felt) ? 0 : null), c = sammenlign(k, felt);

        ['Samlede visninger', kk => sum(kk, 'nu', 'samlede_visninger')],
        ['Interaktioner på kontoen', kk => sum(kk, 'nu', 'interaktioner')],

      o.forEach(x => { const d = tilStreng(new Date(x.oprettet_at)); dage.set(d, (dage.get(d) || 0) + 1); });
      linjer.push(`Et typisk opslag: ${hel(snit(medVis, x => Number(x.visninger)))} visninger i snit (median ${hel(median(medVis.map(x => Number(x.visninger))))}), ${tal(snit(o, inter))} likes+kommentarer+delinger i snit` + (o.length === 1000 ? ' (kun de 1.000 mest sete er med)' : ''));
      linjer.push(`Rytme: ${tal(o.length / p.dage * 7)} ${ord} pr. uge; ${p.dage - dage.size} af periodens ${p.dage} dage uden ${ord}; flest på én dag: ${Math.max(...dage.values())}`);
      const gruppe = (titel, noegle, orden) => {

        linjer.push(titel + ' (antal · visninger pr. stk. i snit · likes+kommentarer+delinger pr. stk. i snit):');
        [...m.entries()].sort((a, b) => orden ? orden.indexOf(a[0]) - orden.indexOf(b[0]) : b[1].length - a[1].length)
          .forEach(([n, l]) => linjer.push(`- ${n}: ${l.length} · ${hel(snit(l.filter(x => x.visninger != null), x => Number(x.visninger)))} · ${tal(snit(l, inter))}${l.length < 3 ? ' (for få til et mønster)' : ''}`));

// ---------- Grafen: én linje pr. platform + samme platform i forrige periode (stiplet) ----------
let grafTilstand = null;
function grafData() {
  const p = periode(), dage = [];
  for (let i = 0; i < p.dage; i++) dage.push(plusDage(p.fra, i));
  const pl = RAEKKEFOELGE.filter(x => (platform === 'alle' || x === platform) && data.konti.some(k => k.platform === x));
  const opslag = (liste) => { const m = new Map(); liste.forEach(r => m.set(r.platform + '|' + r.dato, r[metrik])); return m; };
  const nu = opslag(data.serie), foer = opslag(data.serie_foer);
  const har = harForrige();
  const samme = d => d;
  const raekke = (m, x, dagAf) => dage.map(d => { const n = m.get(x + '|' + dagAf(d)); return n == null ? null : Number(n); });
  const serier = pl.map(x => ({ id: x, navn: PLATFORM[x], farve: `var(--${x})`, v: raekke(nu, x, samme), f: har ? raekke(foer, x, p.foerDag) : null }));
  const saml = (m, dagAf) => dage.map(d => { let s = null; pl.forEach(x => { const n = m.get(x + '|' + dagAf(d)); if (n != null) s = (s || 0) + Number(n); }); return s; });

}
function paenTop(maks) {
  if (!(maks > 0)) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(maks))), n = maks / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 4 ? 4 : n <= 5 ? 5 : n <= 8 ? 8 : 10) * p;
}
function tegnGraf() {
  const g = grafData(), boks = $('#graf');
  $('#grafTitel').textContent = METRIK[metrik] + ' pr. dag';
  const flere = g.serier.length > 1;
  $('#forklaring').innerHTML = (flere ? g.serier.map(s => `<span><i class="streg" style="border-color:${s.farve}"></i>${esc(s.navn)}</span>`).join('') : '') +
    (g.forrige ? `<span><i class="streg stiplet"></i>${foerNavn()}</span>` : '');
  const alle = g.serier.flatMap(s => s.v.concat(s.f || [])).filter(n => n != null);
  if (!alle.length) { boks.innerHTML = '<div class="lille" style="padding:40px 0;text-align:center">Der er ingen tal for ' + esc(METRIK[metrik].toLowerCase()) + ' i perioden endnu.</div>'; $('#grafTabel').innerHTML = ''; grafTilstand = null; return; }

  const B = Math.max(320, boks.clientWidth), H = 280, V = 46, HO = 14, T = 12, BU = 26;
  const top = paenTop(Math.max(...alle)), n = g.dage.length;
  const x = i => V + (n < 2 ? (B - V - HO) / 2 : i * (B - V - HO) / (n - 1));
  const y = v => T + (H - T - BU) * (1 - v / top);
  const sti = v => { let d = '', pen = false; v.forEach((p, i) => { if (p == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p).toFixed(1); pen = true; }); return d; };
  let svg = `<svg viewBox="0 0 ${B} ${H}" role="img" tabindex="0" aria-label="${esc(METRIK[metrik])} pr. dag. Brug piletasterne for at se de enkelte dage.">`;
  for (let i = 0; i <= 4; i++) {
    const v = top * i / 4;
    svg += `<line x1="${V}" x2="${B - HO}" y1="${y(v)}" y2="${y(v)}" stroke="var(--gitter)"/><text x="${V - 8}" y="${y(v) + 4}" text-anchor="end">${kortTal(v)}</text>`;
  }

  // Aarstallet staar paa foerste og sidste maerke, og hvor aaret skifter undervejs
  let sidsteAar = null;
  const akse = (i, altid) => { const t = tilDato(g.dage[i]), medAar = altid || t.getFullYear() !== sidsteAar; sidsteAar = t.getFullYear(); return medAar ? datoKort(t) : datoUdenAar(t); };
  for (let i = 0; i < n; i += trin) if (n - 1 - i >= trin / 2) svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : 'middle'}">${akse(i)}</text>`;
  svg += `<text x="${x(n - 1)}" y="${H - 6}" text-anchor="end">${akse(n - 1, true)}</text>`;
  g.serier.forEach(s => { if (s.f) svg += `<path d="${sti(s.f)}" fill="none" stroke="${s.farve}" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/>`; });
  if (!flere && g.serier[0]) {
    // Flade under linjen -- kun naar der er én serie, og kun hvor der er sammenhaengende tal
    const v = g.serier[0].v; let a = '', start = -1;
    v.forEach((p, i) => { if (p != null && start < 0) start = i; if ((p == null || i === n - 1) && start >= 0) { const slut = p == null ? i - 1 : i; if (slut > start) a += `M${x(start)} ${y(0)}` + v.slice(start, slut + 1).map((q, j) => `L${x(start + j).toFixed(1)} ${y(q).toFixed(1)}`).join('') + `L${x(slut)} ${y(0)}Z`; start = -1; } });
    svg += `<path d="${a}" fill="${g.serier[0].farve}" opacity=".1"/>`;
  }
  g.serier.forEach(s => { svg += `<path d="${sti(s.v)}" fill="none" stroke="${s.farve}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`; });

  g.serier.forEach((s, j) => { svg += `<circle id="punkt${j}" r="4.5" fill="${s.farve}" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`; });
  boks.innerHTML = svg + '</svg>';

  const sv = boks.querySelector('svg');
  grafTilstand = { g, x, y, sv, B, V, HO, i: -1 };
  const tilIndeks = e => { const r = sv.getBoundingClientRect(); const px = (e.clientX - r.left) * B / r.width; return Math.max(0, Math.min(n - 1, Math.round((px - V) / ((B - V - HO) / Math.max(1, n - 1))))); };

  $('#grafTabel').innerHTML = `<thead><tr><th>Dato</th>${g.serier.map(s => `<th>${esc(s.navn)}</th>${s.f ? `<th>${esc(s.navn)}, ${foerNavn().toLowerCase()}</th>` : ''}`).join('')}${flere ? '<th>I alt</th>' + (g.forrige ? `<th>I alt, ${foerNavn().toLowerCase()}</th>` : '') : ''}</tr></thead><tbody>` +
    g.dage.map((d, i) => `<tr><td>${datoKort(tilDato(d))}</td>${g.serier.map(s => `<td>${tal(s.v[i])}</td>${s.f ? `<td>${tal(s.f[i])}</td>` : ''}`).join('')}${flere ? `<td>${tal(g.total[i])}</td>` + (g.forrige ? `<td>${tal(g.forrige[i])}</td>` : '') : ''}</tr>`).join('') + '</tbody>';
}

const KOL = [

  ['Nye følgere', 'nye_foelgere', 'Nye følgere i perioden. Instagram leverer tallet med op til to døgns forsinkelse.'],

// Teksten i forklaringsboksen (data-tip): hvad tallet er, og hvad pilen sammenligner med
// Format: foerste linje er overskriften; en linje med tabulator er "navn <tab> tal <tab> datoer"
// (tallet stilles til hoejre, datoerne staar med smaat nedenunder); alt andet er forklarende tekst.
function tipTekst(navn, hjaelp, nu, c) {
  const linjer = [navn, hjaelp, 'Denne periode\t' + tal(nu) + '\t' + nuTekst];
  if (c) {
    linjer.push(foerNavn() + '\t' + tal(c.foer) + '\t' + forrigeTekst);
    linjer.push('Ændring\t' + c.pct.toLocaleString('da-DK', { maximumFractionDigits: 1, signDisplay: 'exceptZero' }) + ' %');
    if (c.uden) linjer.push('Ændringen er regnet uden ' + c.uden + ', som ikke har tal for den periode.');
  } else if (forrigeTekst) linjer.push('Der er ingen tal for ' + foerNavn().toLowerCase() + ' (' + forrigeTekst + ') at sammenligne med.');
  return linjer.filter(Boolean).join('\n');
}
function tegnKonti() {
  const k = valgte();
  let r;
  if (visning === 'butik') {
    // Facebook-siden og Instagram-kontoen for samme butik hedder det samme hos Meta -- bortset
    // fra stavemaaden ("Borneloppen Liège" paa Instagram), saa der sammenlignes uden ø/accenter.
    const noegle = n => (n || '').toLowerCase().replace(/ø/g, 'o').normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    const m = new Map();
    k.forEach(x => {
      const nk = noegle(x.navn);
      if (!m.has(nk)) m.set(nk, { navn: x.navn, platforme: [], konti: [], nu: {}, foer: {} });
      const b = m.get(nk);
      if (x.platform === 'facebook') b.navn = x.navn;
      b.platforme.push(x.platform); b.konti.push(x);
      ['nu', 'foer'].forEach(t => KOL.forEach(([, f]) => { if (x[t][f] != null) b[t][f] = (b[t][f] || 0) + Number(x[t][f]); }));
    });
    r = [...m.values()];
  } else r = k.map(x => ({ navn: x.navn, brugernavn: x.brugernavn, platforme: [x.platform], konti: [x], nu: x.nu, foer: x.foer }));
  const s = sortering;
  r.sort((a, b) => s.felt === 'navn' ? a.navn.localeCompare(b.navn, 'da') * (s.ned ? -1 : 1) : ((b.nu[s.felt] ?? -1) - (a.nu[s.felt] ?? -1)) * (s.ned ? 1 : -1));
  tabelRaekker = r;
  $('#kontiAntal').textContent = r.length ? r.length + (visning === 'butik' ? (r.length === 1 ? ' butik' : ' butikker') : ' konti') : '';
  const celle = (x, [navn, f, hjaelp]) => { const c = sammenlign(x.konti, f); return `<td data-tip="${esc(tipTekst(x.navn + ' – ' + navn.toLowerCase(), hjaelp, x.nu[f], c))}">${tal(x.nu[f])}${!c ? '' : `<div class="lille">${pctHtml(c.pct)}${c.uden ? '*' : ''}</div>`}</td>`; };
  $('#konti').innerHTML = `<thead><tr><th data-felt="navn" class="${s.felt === 'navn' ? 'sorteret' : ''}">${visning === 'butik' ? 'Butik' : 'Konto'}${s.felt === 'navn' ? (s.ned ? ' ↓' : ' ↑') : ''}</th>${KOL.map(([n, f, hjaelp]) => `<th data-felt="${f}" data-tip="${esc(n + '\n' + hjaelp + '\nKlik for at sortere')}" class="${s.felt === f ? 'sorteret' : ''}">${n}${s.felt === f ? (s.ned ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead><tbody>${
    r.map(x => `<tr><td><div class="konto">${x.platforme.map(p => `<span class="prik ${p}" title="${PLATFORM[p]}"></span>`).join('')}<span>${esc(x.navn)}${x.brugernavn ? ` <span class="lille">@${esc(x.brugernavn)}</span>` : ''}</span></div></td>${KOL.map(kol => celle(x, kol)).join('')}</tr>`).join('')
    || `<tr><td colspan="${KOL.length + 1}" class="lille">Ingen konti endnu.</td></tr>`}</tbody>`;
}
function hentCsv() {

// ---------- Top-opslag (pr. platform) ----------
async function hentOpslag() {
  const p = periode(), nr = ++opslagNr;
  await Promise.all([...document.querySelectorAll('.opslagListe')].map(async boks => {
    const pf = boks.dataset.p;
    let o;
    if (LINK) {
      // Butikslinket faar sine top-opslag med i svaret fra serveren (det kan ikke laese tabellen selv)
      o = (data.opslag || []).filter(x => x.some_konti.platform === pf).slice(0, 5);
    } else {
      // Danske dage, og samme afgraensning som kortene: stories og begivenheder er ikke opslag
      let q = client.from('some_opslag')
        .select('ekstern_id,oprettet_at,tekst,permalink,billede_url,likes,kommentarer,delinger,visninger,some_konti!inner(navn,platform,aktiv,butik_id)')
        .eq('some_konti.aktiv', true).eq('some_konti.platform', pf)
        .or('type.is.null,type.not.in.(STORY,created_event)')
        .gte('oprettet_at', tilDato(p.fra).toISOString()).lt('oprettet_at', tilDato(plusDage(p.til, 1)).toISOString())
        .order(opslagSort, { ascending: false, nullsFirst: false }).limit(5);
      if (butik) q = q.eq('some_konti.butik_id', butik);
      o = (await q).data;
      if (nr !== opslagNr) return;
    }
    boks.innerHTML = (o || []).map(x => {
      const inter = (x.likes || 0) + (x.kommentarer || 0) + (x.delinger || 0);
      const rate = x.visninger ? ` · ${(inter / x.visninger * 100).toLocaleString('da-DK', { maximumFractionDigits: 1 })}% engagement` : '';
      return `<div class="opslag">
      ${x.billede_url ? `<img src="${esc(x.billede_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=tom></div>'">` : '<div class="tom"></div>'}
      <a href="${esc(/^https:\/\//.test(x.permalink || '') ? x.permalink : '#')}" target="_blank" rel="noopener"><div class="lille">${esc(x.some_konti.navn)}, ${datoKort(new Date(x.oprettet_at))}</div><div class="tekst">${esc(x.tekst || '(uden tekst)')}</div></a>
      <div class="tal2"><b>${x.visninger != null ? kortTal(x.visninger) : '–'}</b> visninger<br>${tal(x.likes)} likes · ${tal(x.kommentarer)} komm.${rate}</div>
    </div>`; }).join('') || '<div class="lille">Ingen opslag i perioden endnu.</div>';
  }));
}

// ---------- Bedste tidspunkter at poste (pr. platform) ----------
// Hvert felt er medianen af opslagenes visninger maalt mod butikkens eget normale opslag (1,0x) --
// serveren regner (score i 'tider'), saa ét opslag, der gik godt, ikke traekker feltet op, og store
// og smaa butikker kan laegges sammen. Instagram faar desuden Metas "foelgere online" pr. time.
function tegnTider() {
  const blokNavn = ([a, z]) => String(a).padStart(2, '0') + '–' + String(z).padStart(2, '0');
  const gange = s => s.toLocaleString('da-DK', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '×';
  document.querySelectorAll('.varmekort[data-p]').forEach(kort => {
    const pf = kort.dataset.p;
    const celler = UGEDAGE.map(() => BLOKKE.map(() => ({ antal: 0, inter: 0, score: null })));
    data.tider.forEach(t => {
      if (t.platform !== pf) return;
      const b = BLOKKE.findIndex(([a, z]) => t.time >= a && t.time < z), c = celler[t.ugedag - 1] && celler[t.ugedag - 1][b];
      if (c) { c.antal += t.antal; c.inter += Number(t.interaktioner || 0); if (t.score != null) c.score = Number(t.score); }
    });
    // Foelgere online pr. felt: snit af blokkens timer (seneste 4 uger). Tomt for Facebook.
    const online = UGEDAGE.map(() => BLOKKE.map(() => ({ sum: 0, n: 0 })));
    (data.online || []).forEach(t => {
      if (t.platform !== pf) return;
      const b = BLOKKE.findIndex(([a, z]) => t.time >= a && t.time < z), o = online[t.ugedag - 1] && online[t.ugedag - 1][b];
      if (o) { o.sum += Number(t.antal); o.n++; }
    });
    const onl = o => o.n ? o.sum / o.n : 0;
    const onlMaks = Math.max(0, ...online.flat().map(onl));
    const mangeOnline = (d, b) => onlMaks > 0 && onl(online[d][b]) >= 0.8 * onlMaks;
    const score = c => c.score ?? 0;
    // Et felt taeller foerst med i top 3 og farveskalaen, naar det har mindst 5 opslag. I en kort
    // periode (eller hos en butik, der slaar lidt op) naar ingen felter dertil; saa saenkes kravet
    // trinvis, saa der stadig er noget at se -- med en bemaerkning om, at tallene bygger paa faa opslag.
    const medOpslag = celler.flat().filter(c => c.antal);
    const NOK = [5, 3, 2].find(n => medOpslag.filter(c => c.antal >= n && c.score != null).length >= 3) || 1;
    const taeller = c => c.antal >= NOK && c.score != null;
    const top = celler.flatMap((raekke, d) => raekke.map((c, b) => ({ d, b, c }))).filter(x => taeller(x.c)).sort((a, z) => score(z.c) - score(a.c)).slice(0, 3);
    const rang = (d, b) => top.findIndex(x => x.d === d && x.b === b) + 1;   // 1-3, eller 0
    // Farven foelger feltets placering blandt de taellende felter, ikke afstanden: scorerne ligger
    // taet omkring 1,0, saa en skala efter stoerrelse blev ensfarvet
    const sorteret = celler.flat().filter(taeller).map(score).sort((a, z) => a - z);
    const placering = c => sorteret.length > 1 ? sorteret.indexOf(score(c)) / (sorteret.length - 1) : 1;
    let h = '<div></div>' + BLOKKE.map(b => `<div class="akse top">${blokNavn(b)}</div>`).join('');
    celler.forEach((raekke, d) => {
      h += `<div class="akse">${UGEDAGE[d].slice(0, 3)}</div>`;
      raekke.forEach((c, b) => {
        // Et tomt felt er ikke manglende data: der er bare ikke slaaet noget op i det tidsrum
        if (!c.antal) { h += `<div class="celle tom" title="${UGEDAGE[d]} kl. ${blokNavn(BLOKKE[b])}: ingen opslag i perioden">–</div>`; return; }
        const r = rang(d, b), tekst = `${UGEDAGE[d]} ${blokNavn(BLOKKE[b])}: ${gange(score(c))} så mange visninger som et normalt opslag, ${c.antal} opslag`;
        if (r) { h += `<button type="button" class="celle har r${r}" data-d="${d}" data-b="${b}" aria-label="Nr. ${r}. ${tekst}">${gange(score(c))}</button>`; return; }
        if (!taeller(c)) { h += `<button type="button" class="celle har faa" data-d="${d}" data-b="${b}" aria-label="${tekst} (for få til at tælle med)">${c.score == null ? '?' : gange(score(c))}</button>`; return; }
        // Resten: én farve fra lys til moerk -- jo bedre placeret, jo kraftigere
        const styrke = Math.round(10 + 60 * placering(c));
        h += `<button type="button" class="celle har" data-d="${d}" data-b="${b}" style="background:color-mix(in srgb, var(--varme) ${styrke}%, var(--card));color:${styrke > 55 ? 'var(--card)' : 'var(--fg)'}" aria-label="${tekst}">${gange(score(c))}</button>`;
      });
    });
    kort.innerHTML = h;
    const visCelle = e => {
      const k = e.target.closest('.celle.har'); if (!k) return;
      const c = celler[k.dataset.d][k.dataset.b], r = k.getBoundingClientRect();
      visTip(r.right - 6, r.top + r.height / 2, n => {
        n.appendChild(el('div', 't-titel', UGEDAGE[k.dataset.d] + ' kl. ' + blokNavn(BLOKKE[k.dataset.b])));
        n.appendChild(tipLinje(null, 'Visninger ift. et normalt opslag', c.score == null ? '?' : gange(score(c))));
        n.appendChild(tipLinje(null, 'Interaktioner pr. opslag', tal(c.inter / c.antal)));
        n.appendChild(tipLinje(null, 'Opslag', tal(c.antal)));
        if (onlMaks > 0) n.appendChild(tipLinje(null, 'Følgere online (snit pr. time)', kortTal(Math.round(onl(online[k.dataset.d][k.dataset.b])))));
        if (!taeller(c)) n.appendChild(el('div', 'lille', c.score == null ? 'Ingen visningstal for opslagene' : 'For få opslag til at tælle med i top 3'));
        n.appendChild(el('div', 'lille', 'Klik for at se opslagene'));
      });
    };
    kort.onpointerover = visCelle; kort.onfocusin = visCelle;
    kort.onpointerleave = skjulTip; kort.onfocusout = skjulTip;
    kort.onclick = e => { const k = e.target.closest('.celle.har'); if (k) { skjulTip(); visTidOpslag(pf, Number(k.dataset.d), Number(k.dataset.b), celler[k.dataset.d][k.dataset.b]); } };
    const onlineTekst = x => mangeOnline(x.d, x.b) ? ' · mange følgere online' : '';
    document.querySelector(`.bedst[data-p="${pf}"]`).innerHTML = top.map((x, i) => `<li><span class="rang r${i + 1}">${i + 1}</span>${UGEDAGE[x.d]} kl. ${blokNavn(BLOKKE[x.b])}: <b>${gange(score(x.c))}</b> så mange visninger som normalt <span class="lille">(${x.c.antal} opslag${onlineTekst(x)})</span></li>`).join('')
      || '<li class="lille">Ingen opslag i perioden.</li>';
    document.querySelector(`.tidNote[data-p="${pf}"]`).textContent = !medOpslag.length ? '' : 'Grøn = de tre bedste tidspunkter. 1,0× = et normalt opslag for butikken (medianen af opslagenes visninger).'
      + (NOK > 1 ? ` Grå tal = færre end ${NOK} opslag, så de tæller ikke med.` : '') + ' – = ingen opslag i perioden.'
      + (NOK < 5 ? ' Der er få opslag i perioden, så hvert felt bygger på ganske få opslag – vælg en længere periode (fx 90 dage) for et mere sikkert billede.' : '');
    bedsteTider[pf] = top.map(x => `${UGEDAGE[x.d]} kl. ${blokNavn(BLOKKE[x.b])} (${gange(score(x.c))} så mange visninger som et normalt opslag, ${x.c.antal} opslag${onlineTekst(x)})`);
    // Foelgere online: samme gitter, farvet efter andel af det travleste felt
    document.querySelector(`.online[data-p="${pf}"]`).innerHTML = onlMaks <= 0 ? '' :
      '<div class="lille" style="margin:14px 0 6px"><b>Følgere online</b> – hvor mange af følgerne der er på Instagram, i snit pr. time de seneste 4 uger. Mørkegrøn = flest. Meta oplyser det ikke for Facebook.</div>'
      + '<div class="varmekort"><div></div>' + BLOKKE.map(b => `<div class="akse top">${blokNavn(b)}</div>`).join('')
      + online.map((raekke, d) => `<div class="akse">${UGEDAGE[d].slice(0, 3)}</div>` + raekke.map((o, b) => {
        const s = Math.round(10 + 60 * onl(o) / onlMaks);
        return `<div class="celle" style="background:color-mix(in srgb, var(--ok) ${s}%, var(--card));color:${s > 55 ? 'var(--card)' : 'var(--fg)'}" title="${UGEDAGE[d]} kl. ${blokNavn(BLOKKE[b])}: ca. ${tal(Math.round(onl(o)))} følgere online i snit pr. time">${kortTal(Math.round(onl(o)))}</div>`;
      }).join('')).join('') + '</div>';
  });
}

  await hent();
}
const synlig = () => !document.hidden && innerWidth > 0; // 0 = iframen er skjult bag en anden fane

}
// Maanedsmailen linker med &periode=maaned, saa butikken lander paa sidste maaneds tal
// ... eller med faste datoer (&fra=2026-09-01&til=2026-09-30), saa linket bliver ved med at vise den maaned
{
  const q = new URLSearchParams(location.search), v = q.get('periode'), dato = /^\d{4}-\d{2}-\d{2}$/;
  if (dato.test(q.get('fra') || '') && dato.test(q.get('til') || '')) { $('#periode').value = 'valgfri'; $('#fraDato').value = q.get('fra'); $('#tilDato').value = q.get('til'); periodeFraUrl = true; }
  else if (v && v !== 'valgfri' && [...$('#periode').options].some(o => o.value === v)) { $('#periode').value = v; periodeFraUrl = true; }
  if (q.get('sammenlign') === 'foer') { sammenligning = 'foer'; $('#sammenlignValg').value = 'foer'; }
  visDatoer();
}
if (window.top !== window || LINK) start().catch(() => vis(LINK ? 'ugyldigtLinkVis' : 'ingenAdgangVis'));
</script>
